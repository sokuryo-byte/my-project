<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>wellmo mock</title></head><body>
<!-- ウェルモ「建物管理｜編集」画面のスクリーンショットを基にした検証用の模擬ページ（実際のHTMLではない） -->
<h2>建物管理｜編集</h2>
<table>
<tr><th>マンスリー表示名 <span class="req">必須</span></th><td><input type="text" name="monthly_name" value=""></td>
    <th>ふりがな <span class="req">必須</span></th><td><input type="text" name="kana"></td></tr>
<tr><th>建物名 <span class="req">必須</span></th><td><input type="text" name="build_name"></td>
    <td><label><input type="checkbox" name="show_name" checked>建物名を物件詳細ページに表示する</label></td></tr>
<tr><th>物件種別 <span class="req">必須</span></th><td>
  <label><input type="radio" name="kind" value="1">マンション</label>
  <label><input type="radio" name="kind" value="2">アパート</label>
  <label><input type="radio" name="kind" value="3">一戸建て</label>
  <label><input type="radio" name="kind" value="4">その他</label></td></tr>
<tr><th>所在地 <span class="req">必須</span></th><td><select name="zip_search"><option>住所検索（郵便番号または住所を入力）</option></select>
  <input type="text" name="address1" readonly value="〒468-0003 愛知県 名古屋市 天白区鴻の巣１丁目"><input type="text" name="address2" value="703"></td></tr>
<tr><th>緯度</th><td><input type="text" name="lat" value="35.1"></td><th>経度</th><td><input type="text" name="lng" value="136.9"></td></tr>
<tr><th>周辺環境</th><td><textarea name="around">旧データ</textarea></td></tr>
</table>
<h3>アクセス情報</h3>
<div class="access">
  <div class="row"><div class="lbl">最寄り駅</div><div><select name="station[0]"><option value="">選択</option>
    <option value="101">名古屋市鶴舞線 塩釜口駅</option><option value="102">名古屋市鶴舞線 植田駅</option><option value="103">名古屋市鶴舞線 原駅</option>
    <option value="201">名古屋市桜通線 吹上駅</option><option value="202">名古屋市東山線 今池駅</option><option value="203">名古屋市東山線 千種駅</option><option value="204">JR中央本線 千種駅</option></select></div>
    <div class="lbl">徒歩</div><div><input type="text" name="walk[0]" placeholder="半角"> 分</div><div><input type="text" name="other[0]"></div><button type="button">−</button></div>
  <div class="row"><div class="lbl">最寄り駅</div><div><select name="station[1]"><option value="">選択</option>
    <option value="201">名古屋市桜通線 吹上駅</option><option value="202">名古屋市東山線 今池駅</option><option value="203">名古屋市東山線 千種駅</option><option value="204">JR中央本線 千種駅</option></select></div>
    <div class="lbl">徒歩</div><div><input type="text" name="walk[1]" placeholder="半角"> 分</div><div><input type="text" name="other[1]"></div></div>
  <div class="row"><div class="lbl">最寄り駅</div><div><select name="station[2]"><option value="">選択</option>
    <option value="203">名古屋市東山線 千種駅</option><option value="204">JR中央本線 千種駅</option></select></div>
    <div class="lbl">徒歩</div><div><input type="text" name="walk[2]" placeholder="半角" value="5"> 分</div><div><input type="text" name="other[2]"></div></div>
</div>
<table>
<tr><th>その他アクセス</th><td><input type="text" name="other_access"></td></tr>
<tr><th>空港からのアクセス</th><td><input type="text" name="airport"></td></tr>
</table>
<h3>建物設備</h3>
<div class="equip">
  <label class="eq"><input type="checkbox" name="eq_ev" style="display:none"><img alt=""><span>エレベーター</span></label>
  <label class="eq"><input type="checkbox" name="eq_al" style="display:none"><span>オートロック</span></label>
  <label class="eq"><input type="checkbox" name="eq_box" style="display:none"><span>宅配ボックス</span></label>
  <label class="eq"><input type="checkbox" name="eq_bike" style="display:none" checked><span>駐輪場</span></label>
  <label class="eq"><input type="checkbox" name="eq_gomi" style="display:none"><span>ゴミ捨て場</span></label>
</div>
<table>
<tr><th>建物構造</th><td><select name="structure"><option value="">選択</option><option value="1">木造</option><option value="2">軽量鉄骨</option>
  <option value="3">S(鉄骨造)</option><option value="4">RC(鉄筋コンクリート)</option><option value="5">SRC(鉄骨鉄筋コンクリート)</option><option value="9">その他</option></select></td></tr>
<tr><th>建物階数</th><td><input type="text" name="floor_up"> 階 <input type="text" name="floor_down"> 階</td>
    <th>築年月</th><td><input type="text" name="built_y"> 年 <input type="text" name="built_m"> 月</td></tr>
<tr><th>総戸数</th><td><input type="text" name="units"> 戸</td><th>面積</th><td><input type="text" name="area"></td></tr>
</table>
<button type="button" id="save" onclick="window.__saved=true">保存</button>
<script>window.__changes=0;document.addEventListener('change',function(){window.__changes++;},true);</script>
</body></html>
