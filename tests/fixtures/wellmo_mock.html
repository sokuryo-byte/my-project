<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>wellmo mock</title>
<style>
.hidden-input { display: none; }
.SumoSelect select { display: none; }
.optWrapper { display: none; border: 1px solid #ccc; }
.SumoSelect.open .optWrapper { display: block; }
.select2-dropdown { border: 1px solid #ccc; }
#tmpRow { display: none; }
</style></head><body>
<!--
  ウェルモ「建物管理｜新規登録」の模擬ページ（実際のHTMLではない）。
  2026-11-05 に実画面で取得した診断結果（name属性・dl/dt/dd構造・select2の住所検索・
  SumoSelectの駅検索・ひな形行 #tmpStationSelect）に合わせて作っている。
-->
<h2>建物管理｜新規登録</h2>
<dl><dt class="title required">マンスリー表示名<span>必須</span></dt><dd><input type="text" name="display_name" placeholder="マンスリーサイトに表示する物件名です。"></dd>
    <dt class="title required">ふりがな<span>必須</span></dt><dd><input type="text" name="display_kana"></dd></dl>
<dl><dt class="title required">建物名<span>必須</span></dt><dd><input type="text" name="buildName"> <label><input type="checkbox" name="visible[]" id="checkbox" checked>建物名を物件詳細ページに表示する</label></dd></dl>
<dl><dt class="title required">物件種別<span>必須</span></dt><dd>
  <label><input type="radio" class="hidden-input" name="build_type" value="1"><span>マンション</span></label>
  <label><input type="radio" class="hidden-input" name="build_type" value="2"><span>アパート</span></label>
  <label><input type="radio" class="hidden-input" name="build_type" value="3"><span>一戸建て</span></label>
  <label><input type="radio" class="hidden-input" name="build_type" value="4"><span>その他</span></label></dd></dl>
<dl><dt class="title">建物紹介文</dt><dd><textarea name="free_memo" placeholder="立地や建物設備などのアピールポイントを入力してください。"></textarea></dd></dl>

<h3>建物所在</h3>
<dl><dt class="title required">所在地<span>必須</span></dt><dd>
  <div class="addressSearchBox">
    <select id="buildAddressInputNew" class="addressSearchBox__item select2-hidden-accessible" style="display:none"></select><span class="select2 select2-container" id="addr-s2"><span class="select2-selection">住所検索（郵便番号または住所を入力）</span></span>
  </div>
  <input type="text" name="buildAddress" id="buildAddress" readonly placeholder="住所入力欄 例）○○市△△町00丁目">
  <input type="text" name="address_detail_text" placeholder="左記以外 例）1-1-1"></dd></dl>
<dl><dt class="title">緯度</dt><dd><input type="text" name="build_address_lat" id="lat" placeholder="緯度" value="35.1"></dd>
    <dt class="title">経度</dt><dd><input type="text" name="build_address_lng" id="lng" placeholder="経度" value="136.9"></dd></dl>
<dl><dt class="title">周辺環境</dt><dd><textarea name="address_memo">旧データ</textarea></dd></dl>

<h3>アクセス情報</h3>
<div id="stations">
  <dl class="st-row"><dt class="title">最寄り駅</dt><dd><select name="use_stations[station_codes][]" class="stations lib-selectsrch SumoUnder"></select></dd>
    <dt class="title">徒歩</dt><dd><input type="number" name="use_stations[walk_minutes][]" placeholder="半角"> 分 <input type="text" name="use_stations[info][]" placeholder="例) バスで10分"></dd></dl>
  <dl class="st-row"><dt class="title">最寄り駅</dt><dd><select name="use_stations[station_codes][]" class="stations lib-selectsrch SumoUnder"></select></dd>
    <dt class="title">徒歩</dt><dd><input type="number" name="use_stations[walk_minutes][]" placeholder="半角" value="5"> 分 <input type="text" name="use_stations[info][]" placeholder="例) バスで10分"></dd></dl>
</div>
<dl id="tmpRow"><dt class="title">最寄り駅</dt><dd><select name="use_stations[station_codes][]" id="tmpStationSelect" class="stations"><option value="">沿線を選択してください</option></select></dd>
  <dt class="title">徒歩</dt><dd><input type="number" name="use_stations[walk_minutes][]"> 分 <input type="text" name="use_stations[info][]"></dd></dl>
<div class="add-wrap"><span class="addBtn" id="addStation" style="display:inline-block;width:52px;height:52px;border-radius:50%;background:#ccc;cursor:pointer"><i class="icon"></i></span></div>
<dl><dt class="title">その他アクセス</dt><dd><input type="text" name="access_other"></dd></dl>
<dl><dt class="title">空港からのアクセス</dt><dd><input type="text" name="access_airport"></dd></dl>

<h3>建物設備</h3>
<ul class="itemlist facility-icons">
  <li class="item"><input type="checkbox" class="hidden-input" id="fc1" name="facilities[]" value="1"><label for="fc1"><span class="name">エレベーター</span></label></li>
  <li class="item"><input type="checkbox" class="hidden-input" id="fc2" name="facilities[]" value="2"><label for="fc2"><span class="name">オートロック</span></label></li>
  <li class="item"><input type="checkbox" class="hidden-input" id="fc3" name="facilities[]" value="3"><label for="fc3"><span class="name">宅配ボックス</span></label></li>
  <li class="item"><input type="checkbox" class="hidden-input" id="fc6" name="facilities[]" value="6" checked><label for="fc6"><span class="name">駐輪場</span></label></li>
  <li class="item"><input type="checkbox" class="hidden-input" id="fc9" name="facilities[]" value="9"><label for="fc9"><span class="name">ゴミ捨て場</span></label></li>
</ul>
<dl><dt class="title">その他の設備</dt><dd><textarea name="facility_memo"></textarea></dd></dl>
<h3>その他建物情報</h3>
<dl><dt class="title">建物構造</dt><dd><select name="structure"><option value="1">RC(鉄筋コンクリート)</option><option value="2">WRC(壁式鉄筋コンクリート造)</option>
  <option value="3">SRC(鉄骨鉄筋コンクリート造)</option><option value="4">CFT(コンクリート充填鋼管)</option><option value="5">ALC(軽量気泡コンクリート)</option>
  <option value="6">PC(プレキャスト鉄筋コンクリート)</option><option value="7">S(鉄骨造)</option><option value="8">LGS(軽量鉄骨造)</option><option value="9">W(木造)</option></select></dd></dl>
<dl><dt class="title">建物階数</dt><dd><input type="number" name="floor_up" placeholder="地上"> 階 <input type="number" name="floor_down" placeholder="地下"> 階</dd>
    <dt class="title">築年月</dt><dd><input type="number" name="build_year" class="short" placeholder="2000"> 年 <input type="number" name="build_month" class="short" placeholder="1"> 月</dd></dl>
<dl><dt class="title">総戸数</dt><dd><input type="number" name="total_units" class="short"> 戸</dd><dt class="title">面積</dt><dd><input type="number" name="area_size" class="short"></dd></dl>
<button type="button" id="save" onclick="window.__saved=true">保存</button> <button type="button">保存せずに戻る</button>

<script>
window.__changes = 0;
document.addEventListener('change', function () { window.__changes++; }, true);

/* ---- 駅：SumoSelect＋サーバー検索の模擬（初期は全国の先頭21件のみ。検索すると候補を読み込む） ---- */
var STATIONS = [['9930121', '名古屋市桜通線 吹上'], ['9930306', '名古屋市東山線 今池'], ['9930305', '名古屋市東山線 千種'], ['1130212', 'JR中央本線 千種'], ['9930411', '名古屋市鶴舞線 原']];
var INITIAL = [['1', '北海道新幹線 新青森'], ['2', '北海道新幹線 奥津軽いまべつ'], ['3', '函館本線 函館']];
function sumoize(sel) {
  sel.innerHTML = '<option value="">沿線を選択してください</option>' + INITIAL.map(function (o) { return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('');
  var wrap = document.createElement('div'); wrap.className = 'SumoSelect';
  sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel);
  wrap.insertAdjacentHTML('beforeend', '<p class="CaptionCont SelectBox"><span>沿線を選択してください</span></p><div class="optWrapper"><input type="text" class="search-txt" placeholder="検索..."><ul class="options"></ul></div>');
  var ul = wrap.querySelector('ul'), cap = wrap.querySelector('.CaptionCont'), search = wrap.querySelector('.search-txt');
  function draw() {
    ul.innerHTML = Array.prototype.slice.call(sel.options, 1).map(function (o, i) { return '<li class="opt" data-i="' + (i + 1) + '"><label>' + o.text + '</label></li>'; }).join('');
  }
  draw();
  cap.addEventListener('click', function () { wrap.classList.toggle('open'); });
  search.addEventListener('keyup', function () {
    var q = search.value;
    setTimeout(function () { // サーバーからの読み込みを模擬
      var hits = STATIONS.filter(function (s) { return q && s[1].indexOf(q) >= 0; });
      sel.innerHTML = '<option value="">沿線を選択してください</option>' + hits.map(function (o) { return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('');
      draw();
    }, 400);
  });
  ul.addEventListener('click', function (e) {
    var li = e.target.closest('li'); if (!li) return;
    sel.selectedIndex = Number(li.dataset.i); sel.dispatchEvent(new Event('change', { bubbles: true }));
    cap.querySelector('span').textContent = sel.options[sel.selectedIndex].text; wrap.classList.remove('open');
  });
}
Array.prototype.forEach.call(document.querySelectorAll('#stations select'), sumoize);
document.getElementById('addStation').addEventListener('click', function () {
  var row = document.getElementById('tmpRow').cloneNode(true);
  row.removeAttribute('id'); row.className = 'st-row';
  var s = row.querySelector('select'); s.removeAttribute('id'); s.className = 'stations lib-selectsrch SumoUnder';
  document.getElementById('stations').appendChild(row);
  setTimeout(function () { sumoize(s); }, 50);
});

/* ---- 所在地：select2（郵便番号で住所を検索）の模擬 ---- */
var ADDR = { '4640850': ['〒464-0850 愛知県 名古屋市 千種区今池１丁目', '〒464-0850 愛知県 名古屋市 千種区今池３丁目', '〒464-0850 愛知県 名古屋市 千種区今池５丁目'] };
var s2 = document.querySelector('#addr-s2 .select2-selection');
s2.addEventListener('mousedown', function () {
  if (document.querySelector('.select2-container--open')) return;
  var dd = document.createElement('span');
  dd.className = 'select2-container select2-container--open';
  dd.innerHTML = '<span class="select2-dropdown"><span class="select2-search"><input class="select2-search__field" type="search"></span><ul class="select2-results__options"></ul></span>';
  document.body.appendChild(dd);
  var f = dd.querySelector('input'), ul = dd.querySelector('ul');
  f.addEventListener('input', function () {
    ul.innerHTML = '<li class="select2-results__option loading-results">検索しています…</li>';
    setTimeout(function () {
      var list = ADDR[f.value.replace(/-/g, '')] || [];
      ul.innerHTML = list.length ? list.map(function (t) { return '<li class="select2-results__option">' + t + '</li>'; }).join('') : '<li class="select2-results__option select2-results__message">見つかりません</li>';
    }, 300);
  });
  ul.addEventListener('mouseup', function (e) {
    var li = e.target.closest('.select2-results__option'); if (!li || /message|loading/.test(li.className)) return;
    document.getElementById('buildAddress').value = li.textContent;
    dd.remove();
    // 実画面と同じく、住所を選ぶと少し遅れて緯度経度を自前で上書きする
    setTimeout(function () { document.getElementById('lat').value = '35.164988'; document.getElementById('lng').value = '136.933771'; }, 700);
  });
});
</script>
</body></html>
