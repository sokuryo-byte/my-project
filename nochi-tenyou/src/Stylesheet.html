<style>
  /* 依頼画面・管理画面の共通スタイル。色はここの変数だけで管理する */
  :root {
    --bg: #f3f5f1;
    --surface: #ffffff;
    --fg: #1f2a22;
    --muted: #5d6b60;
    --line: #d3dbd2;
    --accent: #2f6b3f;
    --accent-soft: #e3eee3;
    --on-accent: #ffffff;
    --warn-bg: #fff4d6;
    --warn-fg: #7a5500;
    --danger: #b3261e;
    --danger-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 15px; line-height: 1.7;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 24px 16px 150px; display: grid; gap: 16px; }
  #caseForm { width: 100%; margin: 0; } /* 入れ子の .wrap は中身の幅に縮むため、物件が表示されるまで狭く見えていた */
  h1 { font-size: 1.45rem; margin: 0 0 6px; }
  .lead { margin: 0; color: var(--muted); font-size: .9rem; }
  .user { margin: 6px 0 0; font-size: .8rem; color: var(--muted); }

  section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: grid; gap: 16px; }
  section h2 { font-size: 1.08rem; margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .step { font-size: .75rem; color: var(--accent); letter-spacing: .08em; }

  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .callbox { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--bg); border-radius: 6px; padding: 10px 12px; display: grid; gap: 8px; font-size: .86rem; }
  .callbox .step-h { font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .callbox .tel { font-size: 1.05rem; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; }
  .callbox .muted { color: var(--muted); font-weight: 400; font-size: .8rem; }
  /* トーク例は青系（入力欄＝白と見分ける）。左に「話す」の印 */
  .callbox .script { margin: 0; padding: 6px 10px 6px 30px; background: #e8f1fb; color: #1d3b5e; border-radius: 4px; border: 1px solid #c6daf2; line-height: 1.7; position: relative; }
  .callbox .script::before { content: '話'; position: absolute; left: 7px; top: 7px; width: 17px; height: 17px; line-height: 17px; text-align: center; border-radius: 50%; background: #4a7fc1; color: #fff; font-size: .66rem; font-weight: 700; }
  .callbox .script p { margin: 0; }
  /* 質問（トーク例）は入力欄の直前に1つずつ。空の質問・非表示の設定では出さない */
  .callbox .script.q { padding: 4px 10px 4px 30px; border: 1px solid #c6daf2; border-left: 3px solid #4a7fc1; background: #e8f1fb; font-size: .84rem; }
  .callbox .script.q::before { top: 5px; }
  .callbox .script.q-empty { display: none; }
  .hide-talk .callbox .script { display: none !important; }
  .talk-toggle { margin-left: auto; font-size: .82rem; font-weight: 400; min-height: 0; }
  .callbox .step1 { display: grid; gap: 8px; }
  .caution { margin: 0; font-size: .8rem; color: var(--warn-fg); } /* 注意は控えめな※の一行 */
  .contacts { display: grid; gap: 6px; }
  .contact-rows { display: grid; gap: 6px; }
  .contact-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr) 32px; gap: 6px; align-items: center; }
  .contact-del { height: 32px; width: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; cursor: pointer; color: var(--muted); }
  .contacts .linkbtn { justify-self: start; }
  @media (max-width: 560px) { .contact-row { grid-template-columns: minmax(0, 1fr) 32px; } .contact-row input { grid-column: 1; } .contact-row .contact-del { grid-column: 2; grid-row: 1; } }
  .callbox .step2 { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  /* 電話先が変わる所：①の終わりの線と、②（土地改良区）の帯 */
  .callbox .call-end { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .78rem; font-weight: 700; margin-top: 4px; }
  .callbox .call-end::before, .callbox .call-end::after { content: ''; flex: 1; border-top: 2px solid var(--line); }
  .callbox .call-band { background: var(--accent); color: #fff; border-radius: 6px; padding: 8px 12px; align-items: center; margin-top: 6px; }
  .callbox .call-band .call-band-lbl { font-size: .72rem; font-weight: 700; background: #fff; color: var(--accent); border-radius: 999px; padding: 1px 8px; }
  .callbox .call-band .tel { color: #fff; }
  .callbox .call-band .call-band-lots { font-size: .78rem; font-weight: 700; border: 1px solid rgba(255,255,255,.7); border-radius: 4px; padding: 0 6px; }
  .callbox .step2:has(> .call-band:first-child), .gm-sec.gm-step:has(> .call-band) { border-top: none; padding-top: 0; }
  .row.row-addr { grid-template-columns: minmax(110px, .8fr) minmax(130px, 1fr) minmax(0, 2.4fr); }
  @media (max-width: 560px) { .row.row-addr { grid-template-columns: minmax(0, 1fr); } }
  .field { display: grid; gap: 4px; min-width: 0; align-content: start; } /* 横の欄に説明文があっても入力欄を引き伸ばさない */
  .field > label, .lbl { font-weight: 700; font-size: .92rem; line-height: 1.6; min-height: 1.6em; display: flex; align-items: center; flex-wrap: wrap; }
  .req { font-size: .68rem; font-weight: 700; color: #fff; background: var(--danger); border-radius: 3px; padding: 1px 6px; margin-left: 6px; line-height: 1.5; }
  .help { margin: 0; font-size: .8rem; color: var(--muted); }
  input[type=text], input[type=tel], input[type=number], input[type=date], select, textarea {
    width: 100%; font: inherit; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; box-sizing: border-box; margin: 0;
  }
  input[type=text], input[type=tel], input[type=number], input[type=date], select { height: 40px; line-height: 1.4; }
  textarea { resize: vertical; } /* 広げるのは縦方向だけ */
  dialog.modal { border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; max-width: min(460px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  dialog.modal::backdrop { background: rgba(0,0,0,.35); }
  dialog.modal h2 { margin: 0 0 8px; font-size: 1.05rem; }
  dialog.modal p { margin: 0 0 10px; }
  dialog.modal .btns { justify-content: flex-end; margin-top: 12px; }
  table.breakdown tr.group td { font-weight: 700; color: var(--accent); padding-top: 10px; border-bottom: none; }
  table.breakdown tr.sub td { color: var(--muted); font-size: .85rem; }
  .inline-inputs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .inline-inputs input[type=number] { width: 5.5em; text-align: right; }
  .inline-inputs input[type=date] { width: 11em; } /* テキスト欄とプルダウンの高さをそろえる */
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .invalid { border-color: var(--danger) !important; background: var(--danger-bg) !important; }
  .unit { display: flex; gap: 6px; align-items: center; }
  a { color: var(--accent); }

  /* 区域の選択カード */
  .zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .zone { position: relative; display: block; cursor: pointer; }
  .zone input { position: absolute; opacity: 0; }
  .zone span { display: grid; gap: 4px; height: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .zone b { font-size: 1rem; }
  .zone small { color: var(--muted); font-size: .78rem; line-height: 1.5; }
  .zone em { font-style: normal; font-size: .72rem; font-weight: 700; color: var(--accent); }
  .zone input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .zone input:focus-visible + span { outline: 2px solid var(--accent); }
  .zone.unknown span { border-style: dashed; }

  .choices { display: flex; flex-wrap: wrap; gap: 6px 12px; min-height: 28px; align-items: center; }
  .choices label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-weight: 400; min-width: 6.5em; line-height: 1.6; } /* 選択肢の幅をそろえて行ごとの位置を合わせる */
  .choices label input { margin: 0; }
  .choices + .help::before { content: '※ '; }

  /* 資料アップロード */
  .docs { display: grid; gap: 10px; }
  .doc { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 8px; }
  .doc-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .doc-head b { min-width: 5em; }
  .doc-head label { font-weight: 400; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .doc-head input[type=text] { max-width: 260px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 6px; padding: 10px; text-align: center; color: var(--muted); font-size: .85rem; cursor: pointer; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
  .files { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .85rem; }
  .files li { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .files .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .st { font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .files .st.ng { color: var(--danger); }
  .files button { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0 4px; }

  /* 画面下部に固定する概算見積バー */
  .estimate-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--accent);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
  .estimate-bar .in { max-width: 800px; margin: 0 auto; display: grid; gap: 6px; }
  .estimate-bar .main { display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .total { display: grid; }
  .total small { color: var(--muted); font-size: .75rem; }
  .total strong { font-size: 1.7rem; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; }
  .check-line { display: inline-flex; gap: 8px; align-items: center; min-height: 36px; font-weight: 400; cursor: pointer; }
  .check-line input { width: 18px; height: 18px; margin: 0; }
  a.ghost { display: inline-block; text-decoration: none; }
  .portal-link { font-size: .85rem; white-space: nowrap; }
  .head-links { display: inline-flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .saved-open { padding: 4px 12px; font-size: .82rem; }
  .edit-banner { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 8px 12px; font-size: .88rem; margin-top: 8px; }
  .saved-list { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; }
  .saved-item { text-align: left; font: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; color: var(--fg); }
  .saved-item:hover { border-color: var(--accent); background: var(--accent-soft); }
  .saved-item small { color: var(--muted); }
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .primary, .ghost { font-weight: 700; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  .primary { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); }
  .ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .primary:disabled, .ghost:disabled { opacity: .5; cursor: not-allowed; }
  .linkbtn { background: none; border: none; color: var(--accent); padding: 0; text-decoration: underline; font-size: .85rem; cursor: pointer; justify-self: start; }
  .errors { margin: 0; color: var(--danger); white-space: pre-line; font-size: .85rem; }

  .breakdown { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  .breakdown td { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .breakdown td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; }
  .breakdown tr.sum td { border-bottom: none; font-weight: 700; padding-top: 10px; }
  .notes { margin: 0; padding-left: 1.2em; font-size: .8rem; color: var(--muted); display: grid; gap: 2px; }

  .result { border-width: 2px; }
  .result.ok { background: var(--accent-soft); border-color: var(--accent); }
  .result.warn { background: var(--warn-bg); border-color: var(--warn-fg); }
  .result.ng { background: var(--danger-bg); border-color: var(--danger); }
  .result p { margin: 0; white-space: pre-line; }

  /* 物件カード（複数） */
  .lots { display: grid; gap: 12px; }
  .lot { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 14px; background: var(--bg); }
  /* 物件の2段：1 架電前入力 ／ 2 ヒアリング（架電） */
  .lot-sec { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
  .lot-sec b { font-size: .95rem; }
  .lot-sec .lot-sec-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); color: #fff; font-size: .78rem; font-weight: 700; }
  .lot-sec .lot-sec-help { color: var(--muted); font-size: .8rem; }
  .lot-sec.hear { margin-top: 10px; border-bottom-color: var(--accent); }
  .lot-sec.hear .lot-sec-n { background: var(--accent); }
  .lot-sec.hear b { color: var(--accent); }
  /* 複数筆のヒアリング（電話先ごとの票） */
  .lot.gm > .lot-sec.hear, .lot.gm > .callbox { display: none; }
  .tanto-field input { max-width: 22em; }
  .gis-check { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: .85rem; }
  .gis-check a { font-weight: 700; color: var(--accent); }
  .gis-check .help { flex-basis: 100%; margin: 0; } /* お話しした方（担当者名） */
  .hear-all { display: grid; gap: 12px; margin-top: 4px; }
  .gm-sheets { display: grid; gap: 14px; }
  .gm-sheet { gap: 10px; }
  .gm-sheet-h { font-weight: 700; font-size: .92rem; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .gm-sec { display: grid; gap: 6px; }
  .gm-sec.gm-step { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
  .gm-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gm-title { font-size: .9rem; }
  .gm-same { margin-left: auto; font-size: .8rem; }
  .gm-row { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 4px 0 4px 8px; border-left: 3px solid var(--line); }
  .gm-row.gm-full { grid-template-columns: minmax(0, 1fr); }
  .gm-row.gm-full > .gm-lab { display: none; }
  .gm-lab { font-weight: 700; font-size: .8rem; color: var(--muted); padding-top: 3px; overflow-wrap: anywhere; }
  .gm-cell { min-width: 0; display: grid; gap: 6px; }
  .gm-sec.sq .gm-cell > * > .script.q, .gm-sec.sq .gm-cell > .field > .lbl, .gm-sec.sq .gm-cell > .field > label:first-of-type, .gm-sec.sq .gm-cell > .field > .help { display: none; }
  @media (max-width: 600px) { .gm-row { grid-template-columns: minmax(0, 1fr); } }
  .uke-year { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px 8px; }
  .uke-month { display: inline-flex; align-items: center; gap: 3px; font-weight: 400; font-size: .82rem; }
  .uke-month input { width: 3.6em; padding: 4px 6px; }
  @media (max-width: 560px) { .uke-year { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .lot-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lot-head b { font-size: 1rem; }
  .lot-head .spacer { flex: 1; }
  .lot-head button { font: inherit; font-size: .8rem; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px; cursor: pointer; color: var(--muted); }
  .badge { font-size: .72rem; font-weight: 700; color: var(--warn-fg); background: var(--warn-bg); border-radius: 3px; padding: 1px 6px; }
  .from-tohon { background: var(--warn-bg) !important; border-color: var(--warn-fg) !important; }
  .tohon-drop { padding: 18px 10px; font-weight: 700; }

  .hidden { display: none !important; }
</style>
