<script>
  /**
   * 依頼画面の処理
   *  ・物件（1筆＝1カード）を複数入力できる。カードの追加・引き継ぎ追加・削除
   *  ・謄本をドラッグ → アップロード → サーバーで読み取り → 空欄だけに入れて黄色で表示（要確認）
   *  ・入力のたびに概算見積を画面で即時計算して表示（計算コードは Estimate.gs を画面にも同梱）
   *  ・資料ファイルのドラッグ＆ドロップ → 即アップロード（Drive の一時フォルダ）
   *  ・送信（確認画面なし・ボタンを押したらすぐ送信）
   */

  /** 区域カードの説明文（画面表示用） */
  var ZONE_HINTS = {
    '市街化区域':     { desc: '都市計画図で用途地域の色が塗られている区域', proc: '農地転用は「届出」' },
    '市街化調整区域': { desc: '線引きのある都市計画区域で、市街化区域以外の区域', proc: '農地転用は「許可」' },
    '非線引き区域':   { desc: '都市計画区域のうち、市街化区域・調整区域の区分がない区域', proc: '農地転用は「許可」' },
    '都市計画区域外': { desc: '都市計画区域に含まれない区域', proc: '農地転用は「許可」' },
    '分からない':     { desc: '行政班にて確認します', proc: '見積は「届出」で仮計算' }
  };
  var TOHON = '謄本';
  var MAX_CONTACTS_UI = 5; // Config.gs の MAX_CONTACTS と同じ
  var NON_FARM_USES = ['駐車場', '宅地', '資材置場']; // Config.gs の CONVERTED_LAND_USES と同じ
  // 所在・地番欄の末尾から地番を切り出す（Config.gs の LOT_NUMBER_TAIL_RE と同じ規則）
  var LOT_TAIL_RE = /^(.*?)\s*([0-9０-９]+(?:番地?[0-9０-９]*)?(?:[-－‐ー][0-9０-９]+)*)$/;

  var state = {
    master: [], options: null, farmlandUses: [], upload: null, maxLots: 30,
    uploads: [],        // { localId, docType, name, status:'uploading'|'reading'|'done'|'error', fileId, error, note }
    nextLocalId: 1, nextLotId: 1,
    previewTimer: null, previewSeq: 0, submitting: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var qsa = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }

  // ---------------------------------------------------------
  // 初期化
  // ---------------------------------------------------------
  document.addEventListener('DOMContentLoaded', function () {
    google.script.run
      .withSuccessHandler(init)
      .withFailureHandler(function (err) { showErrors(['初期データの読み込みに失敗しました：' + err.message]); })
      .getInitialData();
  });

  function init(data) {
    state.master = data.master || [];
    state.municipalities = data.municipalities || {};
    state.nogyoIinkai = data.nogyoIinkai || {};
    state.noCityPlanningTax = data.noCityPlanningTax || {};
    if (data.fees) window.ESTIMATE_FEES_ = data.fees;
    state.options = data.options;
    state.farmlandUses = data.farmlandUses || [];
    state.upload = data.upload;
    state.maxLots = data.maxLots || 30;
    if (data.userEmail) $('userInfo').textContent = 'ログイン中：' + data.userEmail;

    // 都道府県：既定値（愛知県）を先頭に、マスタにある都道府県を並べる
    var prefs = [data.defaultPrefecture];
    Object.keys(state.municipalities).forEach(function (p) { if (prefs.indexOf(p) < 0) prefs.push(p); });
    state.master.forEach(function (m) { if (prefs.indexOf(m.prefecture) < 0) prefs.push(m.prefecture); });
    state.prefs = prefs;
    document.body.appendChild(el('datalist', { id: 'cityList' }));
    fillCityList();

    renderDocs(state.options.documents);
    $('uploadHelp').textContent += '（PDF・画像、1ファイル' + data.upload.maxMb + 'MBまで）';
    $('tohonStatus').setAttribute('data-type', TOHON);
    $('tohonFile').setAttribute('accept', state.upload.mimeTypes.join(','));
    setupDropArea($('tohonDrop'), $('tohonFile'), function (files) { addFiles(TOHON, files); });

    addLot();
    bindEvents();
    requestPreview();
  }

  function bindEvents() {
    var form = $('caseForm');
    form.addEventListener('change', onFormChange);
    form.addEventListener('input', onFormChange);
    form.addEventListener('submit', function (e) { e.preventDefault(); });
    $('addLotBtn').addEventListener('click', function () { focusLot(addLot()); });
    $('copyLotBtn').addEventListener('click', function () {
      var lots = qsa('.lot');
      focusLot(addLot(lots.length ? getLotData(lots[lots.length - 1]) : null));
    });
    $('requestBtn').addEventListener('click', function () { submit(true); });
    $('saveOnlyBtn').addEventListener('click', function () { submit(false); });
    $('toDetail').addEventListener('click', function () { $('detail').scrollIntoView({ block: 'start' }); });
    $('againBtn').addEventListener('click', resetForm);
    $('savedOpen').addEventListener('click', openSavedList);
    $('savedClose').addEventListener('click', function () { $('savedDialog').close(); });
    $('editCancel').addEventListener('click', function () { if (confirm('入力中の内容を消して、新しい案件の入力に切り替えますか？')) resetForm(); });
    // トーク例の表示・非表示（この端末に記憶）
    var showTalk = true;
    try { showTalk = localStorage.getItem('nochi.showTalk') !== '0'; } catch (e) { /* 記憶できない環境では常に表示 */ }
    $('showTalk').checked = showTalk;
    document.body.classList.toggle('hide-talk', !showTalk);
    $('showTalk').addEventListener('change', function () {
      document.body.classList.toggle('hide-talk', !this.checked);
      try { localStorage.setItem('nochi.showTalk', this.checked ? '1' : '0'); } catch (e) { /* 無視 */ }
    });
    bindNonFarmDialog();
    // 枠の外にファイルを落としてもブラウザでファイルが開かないようにする
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); });
  }

  function onFormChange(e) {
    // 謄本から入れた欄を人が直したら、黄色の表示を外す
    if (e && e.target && e.target.classList) {
      e.target.classList.remove('from-tohon');
      e.target.classList.remove('invalid'); // 直したらエラー表示も外す
      var zones = e.target.closest && e.target.closest('.zones');
      if (zones) zones.classList.remove('invalid');
      var lot = (e.target.closest && e.target.closest('.lot')) || ownerCard(e.target);
      if (lot && e.target.type === 'radio') {
        if (zones) applyNoshinDefault(lot);
        else if (e.target.name === radioName(lot, 'isNoshin')) lot.removeAttribute('data-noshin-auto'); // 人が選んだ値は以後触らない
      }
      if (lot) { updateCallBox(lot); updateConvertedWarn(lot); }         // 選択に合わせて電話確認・注意表示を更新
      if (lot && gm.on && e.type === 'change') propagateAnswer(e.target);  // 複数筆：未回答の筆にも同じ答えを入れる
    }
    updatePlanRequired();
    schedulePreview();
  }

  // ---------------------------------------------------------
  // 共通の部品
  // ---------------------------------------------------------
  function fillSelect(sel, values, placeholder) {
    sel.innerHTML = '';
    sel.appendChild(new Option(placeholder, ''));
    values.forEach(function (v) { sel.appendChild(new Option(v, v)); });
  }

  function renderChoices(box, name, values) {
    box.innerHTML = '';
    values.forEach(function (v) {
      var label = el('label');
      label.appendChild(el('input', { type: 'radio', name: name, value: v }));
      label.appendChild(document.createTextNode(v));
      box.appendChild(label);
    });
  }

  /** ラベル＋入力欄＋説明文のまとまりを作る（wrapper を渡すと入力欄の代わりにそれを置く） */
  function field(labelText, control, help, required, wrapper) {
    var f = el('div', { 'class': 'field' });
    var l = el('label', { 'for': control.id }, labelText);
    if (required) l.appendChild(el('span', { 'class': 'req' }, '必須'));
    f.appendChild(l);
    f.appendChild(wrapper || control);
    if (help) f.appendChild(el('p', { 'class': 'help' }, help));
    return f;
  }

  function radioField(labelText, box, help, required) {
    var f = el('div', { 'class': 'field' });
    var l = el('span', { 'class': 'lbl' }, labelText);
    if (required) l.appendChild(el('span', { 'class': 'req' }, '必須'));
    f.appendChild(l);
    f.appendChild(box);
    if (help) f.appendChild(help); // 補足は選択肢の下（横並びの欄で選択肢の高さがずれないように）
    return f;
  }

  function setupDropArea(drop, input, onFiles) {
    drop.addEventListener('click', function () { input.click(); });
    drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); onFiles(e.dataTransfer.files); });
    input.addEventListener('change', function () { onFiles(input.files); input.value = ''; });
  }

  // ---------------------------------------------------------
  // 物件カード
  // ---------------------------------------------------------
  /**
   * 物件カードを追加する。
   * @param {Object=} inherit 引き継ぐ値（所在・区域・農振・現況・転用済み・改良区。地番・地目・面積は引き継がない）
   */
  function addLot(inherit) {
    if (qsa('.lot').length >= state.maxLots) {
      showErrors(['物件は' + state.maxLots + '件まで入力できます。']);
      return null;
    }
    var uid = state.nextLotId++;
    var o = state.options;
    var id = function (name) { return 'lot' + uid + '_' + name; };
    var card = el('div', { 'class': 'lot', 'data-uid': String(uid) });

    var head = el('div', { 'class': 'lot-head' });
    head.appendChild(el('b', { 'class': 'lot-title' }));
    head.appendChild(el('span', { 'class': 'badge hidden' }, '謄本から読取・要確認'));
    head.appendChild(el('span', { 'class': 'spacer' }));
    var del = el('button', { type: 'button', 'class': 'lot-del' }, 'この物件を削除');
    del.addEventListener('click', function () { card.remove(); renumberLots(); updatePlanRequired(); schedulePreview(); });
    head.appendChild(del);
    card.appendChild(head);

    // ===== 架電前入力（謄本・課税明細書・現地確認で判明する事項） =====
    var pre = el('div', { 'class': 'lot-sec' });
    pre.appendChild(el('span', { 'class': 'lot-sec-n' }, '1'));
    pre.appendChild(el('b', {}, '架電前入力'));
    pre.appendChild(el('span', { 'class': 'lot-sec-help' }, '謄本・課税明細書・現地確認で判明する事項'));
    card.appendChild(pre);

    // 市区町村・所在地番
    var pref = el('select', { id: id('prefecture'), 'data-f': 'prefecture' });
    state.prefs.forEach(function (p) { pref.appendChild(new Option(p, p)); });
    var lastLot = qsa('.lot').slice(-1)[0];
    pref.value = (inherit && inherit.prefecture) || (lastLot ? lotPref(lastLot) : state.prefs[0]);
    var city = el('input', { type: 'text', id: id('municipality'), maxlength: '50', placeholder: '例）豊田市', list: 'cityList', 'data-f': 'municipality' });
    var onPlaceChange = function () { updateLotLinks(card); updateCallBox(card); updateTaxNote(card); };
    city.addEventListener('input', function () { autoPrefecture(card); onPlaceChange(); });
    // 候補（datalist）は入力中の文字で絞られるため、欄をクリックしたら一度空にして全候補を出す（何も選ばなければ元に戻す）
    city.addEventListener('focus', function () {
      if (!city.value) return;
      city.setAttribute('data-prev', city.value);
      city.placeholder = city.value;
      city.value = '';
    });
    city.addEventListener('blur', function () {
      var prev = city.getAttribute('data-prev');
      city.removeAttribute('data-prev');
      city.placeholder = '例）豊田市';
      if (!city.value && prev) { city.value = prev; }
      autoPrefecture(card); onPlaceChange();
    });
    pref.addEventListener('change', onPlaceChange);
    var address = el('input', { type: 'text', id: id('address'), maxlength: '200', placeholder: '例）○○町字△△ 123番1', 'data-f': 'address' });
    address.addEventListener('input', function () { updateCallBox(card); });
    var row1 = el('div', { 'class': 'row row-addr' });
    row1.appendChild(field('都道府県', pref, null, true));
    row1.appendChild(field('市区町村', city, null, true));
    row1.appendChild(field('所在・地番', address, '町名・字から地番まで（登記地番。住居表示ではありません）', true));
    card.appendChild(row1);

    // 地目・面積
    var chimoku = el('select', { id: id('chimoku'), 'data-f': 'chimoku' });
    fillSelect(chimoku, o.chimoku, '選択してください');
    chimoku.addEventListener('change', function () { checkNonFarm(card); });
    var area = el('input', { type: 'text', id: id('area'), inputmode: 'decimal', placeholder: '例）496', 'data-f': 'area' });
    var unit = el('div', { 'class': 'unit' });
    unit.appendChild(area);
    unit.appendChild(el('span', {}, '㎡'));
    var row2 = el('div', { 'class': 'row' });
    row2.appendChild(field('地目（登記地目）', chimoku));
    row2.appendChild(field('面積（登記地積）', area, null, false, unit));
    card.appendChild(row2);

    // 区域区分
    var zones = el('div', { 'class': 'zones' });
    o.zones.forEach(function (z) {
      var hint = ZONE_HINTS[z] || { desc: '', proc: '' };
      var label = el('label', { 'class': 'zone' + (z === '分からない' ? ' unknown' : '') });
      label.appendChild(el('input', { type: 'radio', name: id('zone'), value: z }));
      var span = el('span');
      span.appendChild(el('b', {}, z));
      span.appendChild(el('small', {}, hint.desc));
      span.appendChild(el('em', {}, hint.proc));
      label.appendChild(span);
      zones.appendChild(label);
    });
    var zoneHelp = el('p', { 'class': 'help' }, '※ 目安：課税明細書に都市計画税があれば市街化区域、なければ市街化調整区域の可能性が高い。');
    zoneHelp.appendChild(el('a', { 'class': 'hidden city-link', target: '_blank', rel: 'noopener' }, ' この市区町村の都市計画情報を開く'));
    var zoneField = radioField('区域区分', zones, zoneHelp, true);
    zoneField.appendChild(el('p', { 'class': 'caution tax-note hidden' }));
    card.appendChild(zoneField);

    // 転用目的（市街化調整区域のときだけ。区域区分のすぐ下）
    var purposeBox = el('div', { 'class': 'choices' });
    renderChoices(purposeBox, id('purpose'), o.purposes);
    var purposeField = radioField('転用目的', purposeBox, el('p', { 'class': 'help' }, '分家住宅の場合は、排水先の確認項目が表示されます'));
    purposeField.classList.add('purpose-field', 'hidden');
    card.appendChild(purposeField);

    // 農振
    var noshin = el('div', { 'class': 'choices' });
    renderChoices(noshin, id('isNoshin'), o.yesNoUnknown);
    var noshinHelp = el('p', { 'class': 'help' }, '市街化区域は「いいえ」が初期選択されます。農振図で分かる場合も、念のため電話で確認してください。');
    noshinHelp.appendChild(el('a', { 'class': 'hidden noshin-link', target: '_blank', rel: 'noopener' }, ' この市区町村の農振図を開く'));
    var noshinField = radioField('農振農用地（青地）かどうか', noshin, noshinHelp); // ヒアリングで聞く（buildCallBox で配置）

    // 現況
    var landUse = el('select', { id: id('landUse'), 'data-f': 'landUse' });
    fillSelect(landUse, o.landUses, '選択してください');
    var landUseOther = el('input', { type: 'text', id: id('landUseOther'), maxlength: '100', placeholder: '例）一部に物置あり', 'data-f': 'landUseOther' });
    var row3 = el('div', { 'class': 'row' });
    row3.appendChild(field('現況利用', landUse, '現在の利用状況'));
    row3.appendChild(field('現況利用（補足）', landUseOther));
    card.appendChild(row3);

    // 転用済み
    var converted = el('div', { 'class': 'choices' });
    renderChoices(converted, id('isConverted'), o.yesNo);
    var convField = radioField('既に転用済みかどうか', converted,
      el('p', { 'class': 'help' }, '現況から判断。許可・届出がなく駐車場等に利用している場合も「はい」'));
    convField.appendChild(el('p', { 'class': 'caution conv-warn hidden', role: 'alert' }));
    card.appendChild(convField); // 既に転用済みかは担当者が判断する（架電前入力）

    // 地目変更登記
    var chimokuHenko = el('label', { 'class': 'check-line' });
    chimokuHenko.appendChild(el('input', { type: 'checkbox', id: id('chimokuHenko'), 'data-f': 'chimokuHenko' }));
    chimokuHenko.appendChild(document.createTextNode(' 地目変更登記が必要'));
    card.appendChild(chimokuHenko);
    // 既に転用済みの物件は、転用した時期（地目変更の原因日付）。同じ登記所でも日付が違えば別申請
    var cdf = field('地目変更の原因日付（転用した時期・分かる範囲で）',
      el('input', { type: 'text', id: id('chimokuDate'), maxlength: '50', placeholder: '例）2015/04 または 平成27年頃', 'data-f': 'chimokuDate' }),
      '同じ登記所でも、転用した日が物件ごとに違うと地目変更登記は別申請になります（未入力は同じ日として計算）');
    cdf.classList.add('chimoku-date', 'hidden');
    card.appendChild(cdf);

    // 土地改良区（農業委員会 → 土地改良区 の順に電話確認）
    var kairyo = el('div', { 'class': 'choices' });
    renderChoices(kairyo, id('landImprovement'), ['はい', 'いいえ', '分からない']);
    // ===== ヒアリング（架電） =====
    var hear = el('div', { 'class': 'lot-sec hear' });
    hear.appendChild(el('span', { 'class': 'lot-sec-n' }, '2'));
    hear.appendChild(el('b', {}, 'ヒアリング（架電）'));
    hear.appendChild(el('span', { 'class': 'lot-sec-help' }, 'トーク例に沿って確認し、回答を記録'));
    card.appendChild(hear);
    card.appendChild(buildCallBox(card, id, o, kairyo, noshinField, convField));
    card._parts = qsa('[data-part]', card); // ヒアリングの部品（複数筆のときは電話先ごとの票へ移す）
    card._moved = [];

    $('lots').appendChild(card);

    if (inherit) {
      city.value = inherit.municipality || '';
      pref.value = inherit.prefecture || pref.value;
      address.value = splitLotNumber(inherit.address || '').place;
      landUse.value = inherit.landUse || '';
      setRadio(card, 'zone', inherit.zone);
      setRadio(card, 'isNoshin', inherit.isNoshin);
      setRadio(card, 'isConverted', inherit.isConverted);
      setRadio(card, 'landImprovement', inherit.landImprovement);
      lotInput(card, 'kairyoName').value = inherit.kairyoName || '';   // 近くの土地は同じ土地改良区のことが多い
      lotInput(card, 'kairyoTel').value = inherit.kairyoTel || '';
      // 同じ土地改良区なら、受益地・手続き・決済金（単価）・手数料も同じことが多いので引き継ぐ（筆ごとに変更可）
      setRadio(card, 'kairyoBenefit', inherit.kairyoBenefit);
      setRadio(card, 'kairyoProcedure', inherit.kairyoProcedure);
      setRadio(card, 'kairyoSettlement', inherit.kairyoSettlement);
      lotInput(card, 'kairyoSettlementNote').value = inherit.kairyoSettlementNote || '';
      if (inherit.kairyoSettlementUnit) lotInput(card, 'kairyoSettlementUnit').value = inherit.kairyoSettlementUnit;
      lotInput(card, 'kairyoFeeAmount').value = inherit.kairyoFeeAmount || '';
      if (inherit.kairyoFeeUnit) lotInput(card, 'kairyoFeeUnit').value = inherit.kairyoFeeUnit;
      lotInput(card, 'kairyoFeeNote').value = inherit.kairyoFeeNote || '';
      setRadio(card, 'iinStamp', inherit.iinStamp);                    // 地元委員も同じ地区なら同じ
      setContacts(card, 'iinContacts', inherit.iinContacts);
      setRadio(card, 'localConsent', inherit.localConsent);            // 同じ地区なら地元関係者も同じことが多い
      setContacts(card, 'localContacts', inherit.localContacts);
      setRadio(card, 'purpose', inherit.purpose);
      setRadio(card, 'drainAdjacent', inherit.drainAdjacent);          // 隣の土地なら排水先も同じことが多い
      setRadio(card, 'drainConsent', inherit.drainConsent);
      lotInput(card, 'drainFeeAmount').value = inherit.drainFeeAmount || '';
      lotInput(card, 'drainFeeNote').value = inherit.drainFeeNote || '';
      setRadio(card, 'drainLocalConsent', inherit.drainLocalConsent);
      setContacts(card, 'drainContacts', inherit.drainContacts);
      applyNoshinDefault(card);
    }
    renumberLots();
    updateLotLinks(card);
    updateCallBox(card);
    updateConvertedWarn(card);
    updateTaxNote(card);
    updatePlanRequired();
    schedulePreview();
    return card;
  }

  function focusLot(card) {
    if (!card) return;
    card.scrollIntoView({ block: 'center' });
    lotInput(card, 'address').focus();
  }

  function renumberLots() {
    var lots = qsa('.lot');
    lots.forEach(function (card, i) {
      cq(card, '.lot-title').textContent = '物件' + (i + 1);
      cq(card, '.lot-del').classList.toggle('hidden', lots.length === 1);
    });
    $('extraLotWrap').classList.toggle('hidden', lots.length < 2); // 筆数加算は2筆以上のときだけ選ぶ
    refreshHearing();
  }

  /**
   * 市街化区域を選んだら、農振農用地を「いいえ」にする（市街化区域に農振農用地は原則ない）。
   * 未選択の場合か、この仕組みで入れた値の場合だけ変更し、人が選んだ値は上書きしない。
   */
  function applyNoshinDefault(card) {
    var current = getRadio(card, 'isNoshin');
    var auto = card.getAttribute('data-noshin-auto') === '1';
    if (getRadio(card, 'zone') === '市街化区域') {
      if (!current) { setRadio(card, 'isNoshin', 'いいえ'); card.setAttribute('data-noshin-auto', '1'); }
    } else if (auto) {
      setRadio(card, 'isNoshin', '');
      card.removeAttribute('data-noshin-auto');
    }
  }

  function lotInput(card, f) { return cq(card, '[data-f=' + f + ']'); }

  function radioName(card, f) { return 'lot' + card.getAttribute('data-uid') + '_' + f; }

  function setRadio(card, f, value) {
    cqa(card, 'input[type=radio][name="' + radioName(card, f) + '"]').forEach(function (r) { r.checked = r.value === value; });
  }

  function getRadio(card, f) {
    var r = cq(card, 'input[type=radio][name="' + radioName(card, f) + '"]:checked');
    return r ? r.value : '';
  }

  function getLotData(card) {
    return {
      prefecture: lotPref(card),
      municipality: lotInput(card, 'municipality').value,
      address: lotInput(card, 'address').value,
      lotNumber: splitLotNumber(lotInput(card, 'address').value).lotNumber,
      chimoku: lotInput(card, 'chimoku').value,
      area: lotInput(card, 'area').value,
      zone: getRadio(card, 'zone'),

      landUse: lotInput(card, 'landUse').value,
      landUseOther: lotInput(card, 'landUseOther').value,

      chimokuHenko: lotInput(card, 'chimokuHenko').checked,

      landImprovement: getRadio(card, 'landImprovement'),
      kairyoName: lotInput(card, 'kairyoName').value,
      kairyoTel: lotInput(card, 'kairyoTel').value,

      kairyoProcedure: getRadio(card, 'kairyoProcedure'),

      localConsent: getRadio(card, 'localConsent'),
      localContacts: getContacts(card, 'localContacts'),
      kairyoExtra: cqa(card, '.kairyo-extra').map(function (b) { return readKairyoExtra(card, b); }),
      purpose: getRadio(card, 'purpose'),
      tenyoRireki: getRadio(card, 'tenyoRireki'),
      rirekiDate: lotInput(card, 'rirekiDate').value,

      rirekiNote: lotInput(card, 'rirekiNote').value,

      kanouNote: lotInput(card, 'kanouNote').value,
      jogaiKanou: getRadio(card, 'jogaiKanou'),
      hojoKuiki: getRadio(card, 'hojoKuiki'),
      hojo8nen: getRadio(card, 'hojo8nen'),
      jogaiJisseki: getRadio(card, 'jogaiJisseki'),
      jogaiKaisu: lotInput(card, 'jogaiKaisu').value,
      jogaiJiki: lotInput(card, 'jogaiJiki').value,
      tenyoUkeDay: lotInput(card, 'tenyoUkeDay').value,
      tenyoUkeMode: getRadio(card, 'tenyoUkeMode'),

  }

  /** 市区町村欄がマスタの市区町村名と一致したら、参照用リンクを出す（一致のみ・推測なし） */
  function updateLotLinks(card) {
    var pref = lotPref(card);
    var a = lotInput(card, 'municipality').value.trim();
    if (a.indexOf(pref) === 0) a = a.slice(pref.length);
    var row = state.master.filter(function (m) { return m.prefecture === pref && a === m.municipality; })[0];
    setLink(cq(card, '.city-link'), row && row.cityPlanUrl);
    setLink(cq(card, '.noshin-link'), row && row.noshinUrl);
  }

  /**
   * 2つ目以降の土地改良区のブロック（1つ目と同じ項目）。radio の name は「kx番号_項目」、入力欄は data-k で区別する。

  var MAX_KAIRYO_EXTRA_UI = 3;
  function addKairyoExtra(card, d) {

    del.addEventListener('click', function () { b.remove(); updateCallBox(card); schedulePreview(); });
    h.appendChild(del);
    b.appendChild(h);
    var inp = function (k, attrs) { return el('input', Object.assign({ type: 'text', 'data-k': k }, attrs || {})); };
    var r1 = el('div', { 'class': 'row' });
    r1.appendChild(field('土地改良区名', inp('kairyoName', { maxlength: '100', placeholder: '例）△△土地改良区' })));
    r1.appendChild(field('土地改良区の電話番号', inp('kairyoTel', { type: 'tel', maxlength: '20', placeholder: '例）0565-00-0000' })));
    b.appendChild(r1);
    b.appendChild(el('div', { 'class': 'script kx-greet' }));
    var radios = function (f, values) { var c = el('div', { 'class': 'choices' }); renderChoices(c, nm(f), values); return c; };
    b.appendChild(prependQ(radioField('受益地に該当するか', radios('kairyoBenefit', o.kairyoBenefit)), 'kx-q-benefit'));
    var kd = el('div', { 'class': 'kx-detail hidden', style: 'display:grid;gap:8px' });
    kd.appendChild(prependQ(radioField('地区除外の手続き', radios('kairyoProcedure', o.kairyoProcedure)), 'kx-q-proc'));
    kd.appendChild(prependQ(radioField('地区除外の決済金', radios('kairyoSettlement', o.kairyoSettlement)), 'kx-q-settle'));
    var sn = el('div', { 'class': 'inline-inputs' });
    sn.appendChild(inp('kairyoSettlementNote', { type: 'number', min: '0', step: '1', inputmode: 'numeric', style: 'width:11em;text-align:right', 'aria-label': '決済金' }));
    sn.appendChild(el('span', {}, '円'));
    var su = el('select', { 'data-k': 'kairyoSettlementUnit', 'aria-label': '決済金の単位', style: 'width:auto' });
    o.settlementUnits.forEach(function (u) { su.appendChild(new Option(u, u)); });
    su.value = '㎡あたり';
    sn.appendChild(su);
    sn.appendChild(el('span', { 'class': 'help kx-calc' }));
    var snf = field('決済金', sn.firstChild, null, false, sn);

    kd.appendChild(snf);
    var fb = el('div', { 'class': 'inline-inputs' });
    fb.appendChild(inp('kairyoFeeAmount', { type: 'number', min: '0', step: '1', inputmode: 'numeric', style: 'width:11em;text-align:right', 'aria-label': '手数料などの金額' }));

  function kxRadio(b, f) {
    var r = b.querySelector('input[type=radio][name="kx' + b.getAttribute('data-kx') + '_' + f + '"]:checked');
    return r ? r.value : '';
  }

  function readKairyoExtra(card, b) {
    var v = function (k) { return b.querySelector('[data-k=' + k + ']').value; };
    return {
      kairyoName: v('kairyoName'), kairyoTel: v('kairyoTel'),
      kairyoBenefit: kxRadio(b, 'kairyoBenefit'), kairyoProcedure: kxRadio(b, 'kairyoProcedure'), kairyoSettlement: kxRadio(b, 'kairyoSettlement'),
      kairyoSettlementNote: v('kairyoSettlementNote'), kairyoSettlementUnit: v('kairyoSettlementUnit'),
      kairyoFeeAmount: v('kairyoFeeAmount'), kairyoFeeUnit: v('kairyoFeeUnit'), kairyoFeeNote: v('kairyoFeeNote'),
      localConsent: kxRadio(b, 'localConsent'), localContacts: getContacts(card, 'kx' + b.getAttribute('data-kx') + '_local')
    };
  }

  function updateKairyoExtra(card, b, k, where, area) {
    var d = readKairyoExtra(card, b);
    var name = d.kairyoName.trim() || '土地改良区';
    b.querySelector('.kx-title').textContent = '②-' + (k + 2) + ' ' + name + 'へ確認（' + (k + 2) + 'つ目）';
    telLink(b.querySelector('.kx-tel'), d.kairyoTel.trim());
    var on = d.kairyoBenefit === '該当する';
    b.querySelector('.kx-detail').classList.toggle('hidden', !on);
    b.querySelector('.kx-settle-note').classList.toggle('hidden', !(on && d.kairyoSettlement === '必要'));
    b.querySelector('[data-contacts="kx' + b.getAttribute('data-kx') + '_local"]').classList.toggle('hidden', d.localConsent !== '必要');
    var amt = Number(d.kairyoSettlementNote);
    b.querySelector('.kx-calc').textContent = amt > 0 && d.kairyoSettlementUnit !== '総額' && area > 0
      ? '→ この筆 ' + area + '㎡で約' + String(Math.round(d.kairyoSettlementUnit === '㎡あたり' ? amt * area : amt * area / 10000)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '円' : '';
    var q = function (cls, lines) { var e = b.querySelector('.' + cls); scriptLines(e, [].concat(lines)); };
    q('kx-greet', '「お世話になっております。（会社名）の（お名前）と申します。農業委員会でこちらをご案内いただきました。' + where + 'の土地で農地転用を予定しております。」');
    q('kx-q-benefit', '「' + (name === '土地改良区' ? '貴改良区の' : name + 'の') + '受益地に該当しますでしょうか。」');
    q('kx-q-proc', '「地区除外の手続きは必要でしょうか。」');
    q('kx-q-settle', '「決済金は必要でしょうか。必要な場合は、金額の目安（㎡単価など）をお教えいただけますでしょうか。」');
    q('kx-q-fee', '「決済金とは別に、手数料などはかかりますでしょうか。」');
    q('kx-q-local', '「また、地元の自治会長さんや水利組合、地元の委員・理事の方など、ご説明や同意書への押印が必要な方はいらっしゃいますでしょうか。」');
    q('kx-q-local-contacts', '「その方のお名前、ご住所、お電話番号をお教えいただけますでしょうか。」');
  }

  /**
   * 連絡先（氏名・住所・電話）の入力リスト。「＋ もう1人追加」で最大 MAX 人まで。
   * @param {string} key data-contacts 属性（iinContacts / localContacts）

  function contactList(key, title, namePh) {
    var wrap = el('div', { 'class': 'contacts hidden', 'data-contacts': key });
    wrap.appendChild(el('span', { 'class': 'lbl' }, title + '（氏名・住所・電話番号）'));
    var rows = el('div', { 'class': 'contact-rows' });
    wrap.appendChild(rows);
    var add = el('button', { type: 'button', 'class': 'linkbtn contact-add' }, '＋ もう1人追加');
    add.addEventListener('click', function () { addContactRow(wrap, {}, namePh); });
    wrap.appendChild(add);
    addContactRow(wrap, {}, namePh);
    wrap.setAttribute('data-ph', namePh);
    return wrap;
  }

  function addContactRow(wrap, c, namePh) {
    var rows = wrap.querySelector('.contact-rows');
    if (rows.children.length >= MAX_CONTACTS_UI) return;
    var row = el('div', { 'class': 'contact-row' });
    var name = el('input', { type: 'text', maxlength: '50', placeholder: namePh || wrap.getAttribute('data-ph') || '氏名', 'data-c': 'name', 'aria-label': '氏名' });
    var addr = el('input', { type: 'text', maxlength: '100', placeholder: '住所', 'data-c': 'address', 'aria-label': '住所' });
    var tel = el('input', { type: 'tel', maxlength: '20', placeholder: '電話番号', 'data-c': 'tel', 'aria-label': '電話番号' });
    name.value = c.name || ''; addr.value = c.address || ''; tel.value = c.tel || '';
    var del = el('button', { type: 'button', 'class': 'contact-del', 'aria-label': 'この行を削除' }, '×');
    del.addEventListener('click', function () {
      if (rows.children.length > 1) row.remove(); else { name.value = addr.value = tel.value = ''; }
      wrap.querySelector('.contact-add').classList.toggle('hidden', rows.children.length >= MAX_CONTACTS_UI);
    });
    [name, addr, tel, del].forEach(function (x) { row.appendChild(x); });
    rows.appendChild(row);
    wrap.querySelector('.contact-add') && wrap.querySelector('.contact-add').classList.toggle('hidden', rows.children.length >= MAX_CONTACTS_UI);
  }

  function getContacts(card, key) {
    return cqa(card, '[data-contacts=' + key + '] .contact-row').map(function (r) {
      return { name: r.querySelector('[data-c=name]').value, address: r.querySelector('[data-c=address]').value, tel: r.querySelector('[data-c=tel]').value };
    }).filter(function (c) { return c.name.trim() || c.address.trim() || c.tel.trim(); });
  }

  function setContacts(card, key, list) {
    var wrap = cq(card, '[data-contacts=' + key + ']');
    wrap.querySelector('.contact-rows').innerHTML = '';
    (list && list.length ? list : [{}]).forEach(function (c) { addContactRow(wrap, c); });
  }

  function telLink(a, tel) {
    var digits = String(tel || '').replace(/[０-９]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0xFEE0); }).replace(/[^0-9]/g, '');
    if (digits.length >= 9) { a.href = 'tel:' + digits; a.textContent = '☎ ' + tel; a.classList.remove('hidden'); }
    else { a.removeAttribute('href'); a.textContent = ''; a.classList.add('hidden'); }
  }

  /** 農業委員会の問い合わせ先（マスタの電話番号 → 組み込みの一覧 の順） */
  function nogyoOf(city, pref) {
    var m = state.master.filter(function (x) { return x.prefecture === pref && x.municipality === city && x.nogyoTel; })[0];
    var d = (state.nogyoIinkai[pref] || {})[city];
    if (m) return { office: (d && d.office) || city + '農業委員会', tel: m.nogyoTel };
    return d && d.tel ? d : null;
  }

  /** 質問（トーク例）1つ分の枠。入力欄の直前に置き、質問と回答を1対1で並べる */
  function qEl(cls) { return el('div', { 'class': 'script q ' + cls }); }
  function prependQ(fieldEl, cls) { fieldEl.insertBefore(qEl(cls), fieldEl.firstChild); return fieldEl; }
  /** 質問の文を入れる（空なら枠ごと隠す） */
  function setQ(card, cls, lines) {
    var b = cq(card, '.' + cls);
    if (!b) return;
    lines = [].concat(lines).filter(Boolean);
    scriptLines(b, lines);
    b.classList.toggle('q-empty', !lines.length);
  }

  function scriptLines(box, lines) {
    box.innerHTML = '';
    lines.forEach(function (t) { box.appendChild(el('p', {}, t)); });
  }

  // ---------------------------------------------------------
  // 複数筆のヒアリング：電話先（市区町村）ごとに1枚、質問ごとに全筆の回答欄を並べる
  //  ・データと判定は筆ごとのまま（各筆のヒアリング欄をこの票へ移して並べるだけ）
  //  ・each：筆ごとに答える欄。最初に答えた値は未回答の筆にも入る（人が直した筆は以後そのまま）
  //  ・one ：1回だけ聞く欄（受付・地元委員・改良区の手続き・排水など）。代表の筆に入力し、同じ電話先の筆へ写す
  //  ・text：トーク例・見出し。所在を「全筆まとめて」に置き換えて1回だけ出す
  // ---------------------------------------------------------
  var gm = { on: false, sig: '', groups: [], busy: false, again: false };

  /** ヒアリングの部品に印を付ける（key：質問、kind：each/one/text、sub：one を分ける単位） */
  function pt(e, key, kind, sub) {
    e.setAttribute('data-part', key);
    e.setAttribute('data-kind', kind);
    if (sub) e.setAttribute('data-sub', sub);
    return e;
  }

  /** 物件カード内の要素（票へ移した部品の中も含めて）探す */
  function cq(card, sel) {
    var r = card.querySelector(sel);
    if (r || !card._moved || !card._moved.length) return r;
    for (var i = 0; i < card._moved.length; i++) {
      var p = card._moved[i];
      if (p.matches(sel)) return p;
      r = p.querySelector(sel);
      if (r) return r;
    }
    return null;
  }
  function cqa(card, sel) {
    var out = qsa(sel, card);
    (card._moved || []).forEach(function (p) {
      if (p.matches(sel)) out.push(p);
      out = out.concat(qsa(sel, p));
    });
    return out;
  }
  function ownerCard(node) {
    var o = node && node.closest && node.closest('[data-owner]');
    if (!o) return null;
    return qsa('.lot').filter(function (k) { return k.getAttribute('data-uid') === o.getAttribute('data-owner'); })[0] || null;
  }

  /** トーク例で指す当該地（地番まで）。未入力の部分は（ ）で示す */
  function lotWhere(card) {
    var city = lotInput(card, 'municipality').value.trim();
    var addr = lotInput(card, 'address').value.trim();
    return !addr ? (city || '') + '（所在・地番）' : (city || '') + addr + (splitLotNumber(addr).lotNumber ? '' : '（地番）');
  }
  /** 同じ電話先の筆をまとめた当該地。例）豊田市○○町字△△ 123番1、123番2、125番（3筆） */
  function groupWhere(cards) {
    if (cards.length < 2) return lotWhere(cards[0]);
    var city = lotInput(cards[0], 'municipality').value.trim();
    var parts = cards.map(function (k) { return splitLotNumber(lotInput(k, 'address').value.trim()); });
    var samePlace = parts.every(function (x) { return x.lotNumber && x.place === parts[0].place; });
    var body = samePlace
      ? parts[0].place + ' ' + parts.map(function (x) { return x.lotNumber; }).join('、')
      : cards.map(function (k) { return lotInput(k, 'address').value.trim() || '（所在・地番）'; }).join('、');
    return city + body + '（' + cards.length + '筆）';
  }
  function lotLabel(card) {
    var i = qsa('.lot').indexOf(card);
    var no = splitLotNumber(lotInput(card, 'address').value.trim()).lotNumber;
    return '物件' + (i + 1) + (no ? ' ' + no : '');
  }

  /** 部品が今その筆で表示される状態か（元の位置の親が隠れていないか） */
  function partShown(card, p) {
    if (p.classList.contains('hidden') || p.classList.contains('q-empty')) return false;
    if (!p.children.length && !p.textContent.trim()) return false; // 中身のない枠（移し替え先など）は出さない
    var n = p._ph && p.parentNode !== p._ph.parentNode ? p._ph.parentNode : p.parentNode;
    while (n && n !== card) {
      if (n.classList && n.classList.contains('hidden')) return false;
      n = n.parentNode;
    }
    return true;
  }

  // ---- 回答欄の読み書き（同じ部品どうしは同じ並びなので、順番で対応させる） ----
  function ctlGroups(part) {
    var groups = [], byName = {};
    qsa('input,select,textarea', part).forEach(function (c) {
      if (c.closest('[data-contacts]') || c.closest('.kairyo-extra')) return;
      var key = c.type === 'radio' ? 'r:' + c.name
        : c.type === 'checkbox' && c.hasAttribute('data-kubun') ? 'k'
        : c.type === 'checkbox' && c.hasAttribute('data-doc') ? 'd' : null;
      if (key && byName[key]) { byName[key].els.push(c); return; }
      var g = { type: c.type === 'radio' ? 'radio' : c.type === 'checkbox' ? 'check' : 'val', els: [c] };
      if (key) byName[key] = g;
      groups.push(g);
    });
    return groups;
  }
  function getG(g) {
    if (g.type === 'val') return g.els[0].value;
    return g.els.filter(function (c) { return c.checked; }).map(function (c) { return c.value; }).join('\n');
  }
  function setG(g, v) {
    if (g.type === 'val') { g.els[0].value = v; return; }
    var vs = String(v).split('\n');
    g.els.forEach(function (c) { c.checked = vs.indexOf(c.value) >= 0; });
  }
  function emptyG(g) { return g.type === 'val' ? g.els[0].tagName !== 'SELECT' && !g.els[0].value : !g.els.some(function (c) { return c.checked; }); }
  function contactsOf(part) {
    return qsa('[data-contacts]', part).concat(part.matches('[data-contacts]') ? [part] : []).map(function (w) {
      return qsa('.contact-row', w).map(function (r) {
        return { name: r.querySelector('[data-c=name]').value, address: r.querySelector('[data-c=address]').value, tel: r.querySelector('[data-c=tel]').value };
      }).filter(function (c) { return c.name.trim() || c.address.trim() || c.tel.trim(); });
    });
  }
  function partValue(part) { return JSON.stringify([ctlGroups(part).map(getG), contactsOf(part)]); }
  function partEmpty(part) {
    return ctlGroups(part).every(emptyG) && contactsOf(part).every(function (l) { return !l.length; });
  }
  /** src の回答を dst へ写す。変わったら true */
  function copyPart(src, dst) {
    var a = ctlGroups(src), b = ctlGroups(dst);
    if (a.length !== b.length) return false;
    var before = partValue(dst);
    a.forEach(function (g, i) { setG(b[i], getG(g)); });
    var lists = contactsOf(src);
    var wraps = qsa('[data-contacts]', dst).concat(dst.matches('[data-contacts]') ? [dst] : []);
    wraps.forEach(function (w, i) {
      var cur = JSON.stringify(contactsOf(w)[0] || []);
      if (lists[i] && JSON.stringify(lists[i]) !== cur) {
        w.querySelector('.contact-rows').innerHTML = '';
        (lists[i].length ? lists[i] : [{}]).forEach(function (c) { addContactRow(w, c); });
      }
    });
    return partValue(dst) !== before;
  }

  /** 筆ごとの欄：答えた値を、未回答（または自動で入れたまま）の筆にも入れる */
  function propagateAnswer(t) {
    var row = t.closest && t.closest('.gm-row');
    if (!row || !row._sec || row._sec.kind !== 'each' || row._sec.noProp) return;
    var groups = ctlGroups(row._part);
    var idx = -1;
    groups.forEach(function (g, i) { if (g.els.indexOf(t) >= 0) idx = i; });
    if (idx < 0) return;
    if (row._part._auto) delete row._part._auto[idx]; // 人が答えた欄は以後自動で変えない
    var v = getG(groups[idx]), src = row._card.getAttribute('data-uid');
    row._sec.rows.forEach(function (r) {
      if (r === row || r.classList.contains('hidden')) return;
      var g2 = ctlGroups(r._part)[idx];
      // 未回答の筆と、この筆の回答を自動で入れたままの筆だけ（ほかの筆を直したときは広げない）
      if (!g2 || !(emptyG(g2) || (r._part._auto && r._part._auto[idx] === src))) return;
      if (getG(g2) === v) return;
      setG(g2, v);
      r._part._auto = r._part._auto || {};
      r._part._auto[idx] = src;
      updateCallBox(r._card);
    });
  }

  /** 物件が2筆以上なら票を作り直す（筆・電話先の組み合わせが変わったときだけ） */
  function refreshHearing() {
    if (gm.busy) { gm.again = true; return; }
    gm.busy = true;
    try {
      var n = 0;
      do { gm.again = false; doRefreshHearing(); } while (gm.again && ++n < 5);
    } finally { gm.busy = false; }
  }

  function groupKey(card) { return lotPref(card) + '|' + lotInput(card, 'municipality').value.trim(); }

  function doRefreshHearing() {
    var lots = qsa('.lot');
    var box = $('hearAll');
    if (!box) return;
    if (lots.length < 2) { if (gm.on || gm.sig) restoreHearing(lots); return; }
    var sig = lots.map(function (k) { return k.getAttribute('data-uid') + '@' + groupKey(k); }).join(',');
    if (sig !== gm.sig) layoutHearing(lots, sig);
    gm.groups.forEach(updateSheet);
  }

  function restoreHearing(lots) {
    lots.forEach(function (card) {
      (card._moved || []).forEach(function (p) { p._ph.parentNode.insertBefore(p, p._ph); p.removeAttribute('data-owner'); });
      card._moved = [];
      card.classList.remove('gm');
    });
    $('gmSheets').innerHTML = '';
    $('hearAll').classList.add('hidden');
    gm.on = false; gm.sig = ''; gm.groups = [];
  }

  function layoutHearing(lots, sig) {
    var sheets = $('gmSheets');
    sheets.innerHTML = '';
    var groups = [], byKey = {};
    lots.forEach(function (card) {
      var k = groupKey(card);
      if (!byKey[k]) { byKey[k] = { cards: [] }; groups.push(byKey[k]); }
      byKey[k].cards.push(card);
      card._moved = [];
      card.classList.add('gm');
    });
    var defs = lots[0]._parts.map(function (p) {
      return { key: p.getAttribute('data-part'), kind: p.getAttribute('data-kind'), sub: p.getAttribute('data-sub') || '' };
    });
    groups.forEach(function (g, gi) {
      var sheet = el('div', { 'class': 'callbox gm-sheet' });
      g.head = el('div', { 'class': 'gm-sheet-h' });
      sheet.appendChild(g.head);
      g.secs = defs.map(function (d) {
        var sec = { key: d.key, kind: d.kind, sub: d.sub, noProp: d.key === 'kx' || d.key === 'kairyoAdd' || d.key === 'stop', rows: [] };
        sec.el = el('div', { 'class': 'gm-sec gm-' + d.kind + (d.key === 'kairyoH' || d.key === 'drainH' ? ' gm-step' : '') });
        if (d.kind === 'text') { sheet.appendChild(sec.el); return sec; }
        var head = el('div', { 'class': 'gm-head hidden' });
        sec.title = el('b', { 'class': 'gm-title' });
        head.appendChild(sec.title);
        if (d.kind === 'each' && !sec.noProp) {
          sec.same = el('button', { type: 'button', 'class': 'linkbtn gm-same' }, '全筆に同じ回答を入れる');
          sec.same.addEventListener('click', function () { sameForAll(sec); });
          head.appendChild(sec.same);
        }
        sec.head = head;
        sec.el.appendChild(head);
        sec.q = el('div', { 'class': 'script q gm-q hidden' });
        sec.el.appendChild(sec.q);
        g.cards.forEach(function (card) {
          var p = card._parts.filter(function (x) { return x.getAttribute('data-part') === d.key; })[0];
          if (!p) return;
          if (!p._ph) { p._ph = document.createComment('part'); p.parentNode.insertBefore(p._ph, p); }
          var row = el('div', { 'class': 'gm-row' });
          row._card = card; row._part = p; row._sec = sec;
          row.appendChild(el('span', { 'class': 'gm-lab' }));
          var cell = el('div', { 'class': 'gm-cell' });
          cell.appendChild(p);
          row.appendChild(cell);
          p.setAttribute('data-owner', card.getAttribute('data-uid'));
          p._join = undefined;
          card._moved.push(p);
          sec.rows.push(row);
          sec.el.appendChild(row);
        });
        sheet.appendChild(sec.el);
        return sec;
      });
      g.sheet = sheet;
      sheets.appendChild(sheet);
    });
    $('hearAll').classList.remove('hidden');
    gm.on = true; gm.sig = sig; gm.groups = groups;
  }

  function sameForAll(sec) {
    var rows = sec.rows.filter(function (r) { return !r.classList.contains('hidden'); });
    if (rows.length < 2) return;
    rows.slice(1).forEach(function (r) {
      if (copyPart(rows[0]._part, r._part)) {
        r._part._auto = {};
        ctlGroups(r._part).forEach(function (x, i) { r._part._auto[i] = rows[0]._card.getAttribute('data-uid'); });
        updateCallBox(r._card);
      }
    });
    schedulePreview();
  }

  /** 文中の当該地を「全筆まとめて」に置き換える */
  function groupText(node, card, cards) {
    var c = node.cloneNode(true);
    c.removeAttribute('data-part'); c.removeAttribute('data-kind'); c.removeAttribute('data-sub');
    c.classList.remove('hidden');
    if (cards.length < 2) return c;
    var w = lotWhere(card), gw = groupWhere(cards); // 当該地は、その質問をする筆だけをまとめる
    var walk = document.createTreeWalker(c, NodeFilter.SHOW_TEXT, null, false);
    var t;
    while ((t = walk.nextNode())) t.nodeValue = t.nodeValue.split(w).join(gw).replace(/この土地/g, 'これらの土地').replace(/この筆/g, '各筆');
    return c;
  }

  function subOf(sec, card) { return sec.sub === 'kairyo' ? lotInput(card, 'kairyoName').value.trim() : ''; }

  function updateSheet(g) {
    g.head.textContent = (lotInput(g.cards[0], 'municipality').value.trim() || '市区町村未入力') + 'の物件：' + g.cards.map(lotLabel).join('、');
    g.secs.forEach(function (sec) {
      if (sec.kind === 'text') {
        var seen = {}, nodes = [];
        var on = g.cards.map(function (card) {
          var p = card._parts.filter(function (x) { return x.getAttribute('data-part') === sec.key; })[0];
          return p && partShown(card, p) && p.textContent.trim() ? { card: card, p: p } : null;
        }).filter(Boolean);
        var onCards = on.map(function (x) { return x.card; });
        on.forEach(function (x) {
          var c = groupText(x.p, x.card, onCards);
          if (seen[c.textContent]) return;
          seen[c.textContent] = 1;
          nodes.push(c);
        });
        sec.el.innerHTML = '';
        nodes.forEach(function (c) { sec.el.appendChild(c); });
        sec.el.classList.toggle('hidden', !nodes.length);
        return;
      }
      var shown = sec.rows.filter(function (r) { return partShown(r._card, r._part); });
      if (sec.kind === 'one') {
        var leaders = {};
        sec.rows.forEach(function (r) { r.classList.add('hidden'); r._covers = []; });
        shown.forEach(function (r) {
          var k = subOf(sec, r._card), L = leaders[k];
          if (!L) { leaders[k] = r; r.classList.remove('hidden'); r._covers = [r._card]; return; }
          if (r._part._join === undefined) r._part._join = partEmpty(r._part) || partValue(r._part) === partValue(L._part);
          if (r._part._join) {
            L._covers.push(r._card);
            if (copyPart(L._part, r._part)) updateCallBox(r._card);
          } else { r.classList.remove('hidden'); r._covers = [r._card]; leaders[k + '#' + shown.indexOf(r)] = r; }
        });
        var vis = sec.rows.filter(function (r) { return !r.classList.contains('hidden'); });
        vis.forEach(function (r) {
          var lab = r.querySelector('.gm-lab');
          var many = vis.length > 1; // 筆や土地改良区で答えが分かれたときだけ、どの筆の欄かを出す
          lab.textContent = !many ? '' : r._covers.map(function (k) { return '物件' + (qsa('.lot').indexOf(k) + 1); }).join('・') + (sec.sub === 'kairyo' && subOf(sec, r._card) ? '（' + subOf(sec, r._card) + '）' : '');
          r.classList.toggle('gm-full', !many);
        });
        sec.head.classList.add('hidden');
        sec.q.classList.add('hidden');
        sec.el.classList.remove('sq');
        sec.el.classList.toggle('hidden', !vis.length);
        return;
      }
      // each：筆ごとの回答欄。質問の文が全筆同じなら1回だけ出す
      sec.rows.forEach(function (r) {
        r.classList.toggle('hidden', shown.indexOf(r) < 0);
        r.querySelector('.gm-lab').textContent = lotLabel(r._card);
        r.classList.remove('gm-full');
      });
      var shownCards = shown.map(function (r) { return r._card; });
      var qtexts = shown.map(function (r) {
        return qsa(':scope > .script.q', r._part).filter(function (x) { return !x.classList.contains('q-empty'); })
          .map(function (x) { return groupText(x, r._card, shownCards).textContent; }).join('\n');
      });
      var shared = shown.length > 1 && qtexts.every(function (t) { return t === qtexts[0]; });
      sec.el.classList.toggle('sq', shared);
      sec.q.innerHTML = '';
      if (shared && qtexts[0]) {
        qsa(':scope > .script.q', shown[0]._part).filter(function (x) { return !x.classList.contains('q-empty'); })
          .forEach(function (x) { qsa('p', groupText(x, shown[0]._card, shownCards)).forEach(function (pp) { sec.q.appendChild(pp); }); });
      }
      sec.q.classList.toggle('hidden', !(shared && qtexts[0]));
      var lb = shown.length ? shown[0]._part.querySelector(':scope > .lbl, :scope > label') : null;
      sec.title.textContent = shared && lb ? lb.firstChild.textContent : '';
      if (sec.same) sec.same.classList.toggle('hidden', shown.length < 2);
      sec.head.classList.toggle('hidden', !(shared && lb) && !(sec.same && shown.length > 1));
      sec.el.classList.toggle('hidden', !shown.length);
    });
  }

  /** 市区町村・所在・選択に合わせて、電話番号とトーク例を更新する */
  function updateCallBox(card) {
    var city = lotInput(card, 'municipality').value.trim();
    var where = lotWhere(card); // トーク例は必ず当該地（地番まで）を指す
    var h = cq(card, '.nogyo-h');
    h.innerHTML = '';
    h.appendChild(el('span', {}, '① 農業委員会へ確認'));
    var n = city ? nogyoOf(city, lotPref(card)) : null;
    if (n) {
      h.appendChild(el('span', {}, n.office));
      var a = el('a', { 'class': 'tel' }); telLink(a, n.tel); h.appendChild(a);
    } else {
      h.appendChild(el('span', { 'class': 'muted' }, city ? city + 'の農業委員会の電話番号は未登録です（市町村の代表番号からお問い合わせください）' : '市区町村を入力すると電話番号を表示します'));
    }
    var zone = getRadio(card, 'zone');
    var permit = ['市街化調整区域', '非線引き区域', '都市計画区域外'].indexOf(zone) >= 0;
    cq(card, '.purpose-field').classList.toggle('hidden', zone !== '市街化調整区域');
    var purpose = zone === '市街化調整区域' ? getRadio(card, 'purpose') : '';
    var purposeText = purpose && purpose !== 'その他' ? purpose : '住宅等';
    var noshin = getRadio(card, 'isNoshin');

  /**
   * 現況利用と「既に転用済み」の食い違いに注意を出す。
   *  ・現況が農地以外（駐車場・宅地・資材置場）＝既に転用している状態なのに「いいえ」
   *  ・現況が農地（耕作中・休耕・荒地）なのに「はい」
   */
  function updateConvertedWarn(card) {
    var use = lotInput(card, 'landUse').value;
    var conv = getRadio(card, 'isConverted');
    cq(card, '.chimoku-date').classList.toggle('hidden', !(lotInput(card, 'chimokuHenko').checked && conv === 'はい'));
    var msg = '';
    if (NON_FARM_USES.indexOf(use) >= 0 && conv === 'いいえ') {
      msg = '※ 現況が「' + use + '」＝既に転用している状態です。無許可の場合は「はい」を選んでください。';
    } else if (state.farmlandUses.indexOf(use) >= 0 && conv === 'はい') {
      msg = '※ 現況が農地（' + use + '）のため、「はい」でよいかご確認ください。';
    }
    var w = cq(card, '.conv-warn');
    w.textContent = msg;
    w.classList.toggle('hidden', !msg);
  }

  // ---------------------------------------------------------
  // 登記地目が農地以外 → 「農地転用の手続きは原則不要」を確認
  // ---------------------------------------------------------
  var FARM_CHIMOKU = ['田', '畑'];

  function checkNonFarm(card) {
    var v = lotInput(card, 'chimoku').value;
    if (!v || FARM_CHIMOKU.indexOf(v) >= 0 || card.getAttribute('data-nf-ack') === v) return;
    var dlg = $('nonFarmDialog');
    if (dlg.open) { // 謄本で複数の物件が入った場合は、閉じたあと順に確認する
      state.nfQueue = state.nfQueue || [];
      if (state.nfCard !== card && state.nfQueue.indexOf(card) < 0) state.nfQueue.push(card);
      return;
    }
    state.nfCard = card;
    var name = cq(card, '.lot-title').textContent;
    $('nfText').textContent = name + 'の登記地目が「' + v + '」（農地以外）の場合、農地転用の手続きは原則不要です。' +
      '地目の選択が間違いであれば、閉じて修正してください。';
    $('nfConfirm').textContent = qsa('.lot').length > 1 ? '農地以外で間違いない（この物件を外す）' : '農地以外で間違いない（依頼を終了）';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function closeNonFarm() {
    var dlg = $('nonFarmDialog');
    if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
    nextNonFarm();
  }

  /** 待っている物件があれば、次の確認を出す */
  function nextNonFarm() {
    setTimeout(function () {
      var q = state.nfQueue || [];
      while (q.length) {
        var c = q.shift();
        if (document.body.contains(c) && !$('caseForm').classList.contains('hidden')) { checkNonFarm(c); return; }
      }
    }, 0);
  }

  function bindNonFarmDialog() {
    $('nfFix').addEventListener('click', function () {
      closeNonFarm();
      var c = state.nfCard;
      if (c) { c.scrollIntoView({ block: 'center' }); lotInput(c, 'chimoku').focus(); }
    });
    $('nonFarmDialog').addEventListener('cancel', function () { // Esc キーは「修正する」と同じ
      var c = state.nfCard;

    $('nfConfirm').addEventListener('click', function () {

        // 複数の物件がある場合は、この物件だけ外す

      // 物件が1件だけ：依頼は不要のため、ここで終了を促す

      $('resultText').textContent = '登記地目が「' + v + '」（農地以外）のため、農地転用の手続きは原則不要です。依頼はせずに、ここで終了してください。' +
        '\n※ 別の物件を依頼する場合は「新しい案件を入力する」を押してください。';
      $('caseForm').classList.add('hidden');
      $('estimateBar').classList.add('hidden');
      window.scrollTo(0, 0);
    });
  }

  /** 「○○町字△△ 123番1」→ { place: '○○町字△△', lotNumber: '123番1' } */
  function splitLotNumber(text) {
    var m = String(text || '').trim().match(LOT_TAIL_RE);
    return m ? { place: m[1].trim(), lotNumber: m[2] } : { place: String(text || '').trim(), lotNumber: '' };
  }

  /**
   * 選択中の都道府県の市区町村：[{ full: 謄本上の表記（郡名付き）, name: 市区町村欄に入れる名前 }]
   * 組み込みの一覧（Config.gs の MUNICIPALITIES）＋「マスタ」シートの市区町村。
   */
  function cityEntries(prefOverride) {
    var pref = prefOverride;
    var out = [], seen = {};
    function add(full) {
      full = String(full || '').trim();
      var name = full.replace(/^.+?郡(?=.+[町村]$)/, '');
      if (full && !seen[full]) { seen[full] = true; out.push({ full: full, name: name }); }
    }
    (state.municipalities[pref] || []).forEach(add);
    state.master.forEach(function (m) { if (m.prefecture === pref) add(m.municipality); });
    return out;
  }

  /** 文字列の先頭にある市区町村（郡名付き・なしの両方で前方一致、長い方を優先）。{ name, length } か null */
  function cityPrefixOf(text, prefOverride) {
    var pref = prefOverride;
    var t = String(text || '');
    var offset = 0;
    if (t.indexOf(pref) === 0) { t = t.slice(pref.length); offset = pref.length; }
    var best = null;
    cityEntries(pref).forEach(function (c) {
      [c.full, c.name].forEach(function (label) {
        if (t.indexOf(label) === 0 && (!best || label.length > best.length - offset)) best = { name: c.name, length: offset + label.length };
      });
    });
    return best;
  }

  function lotPref(card) { return lotInput(card, 'prefecture').value; }

  /**
   * 市区町村欄の名前が、物件の都道府県になく、ほかの1県だけにある場合は、都道府県を切り替える（例：岐阜市 → 岐阜県）。
   * 名前の完全一致のみ。同じ名前の市町村が複数の県にある場合は切り替えない。
   */
  function autoPrefecture(card) {
    var name = lotInput(card, 'municipality').value.trim();
    if (!name) return;
    var has = function (p) { return cityEntries(p).some(function (c) { return c.name === name || c.full === name; }); };
    if (has(lotPref(card))) return;
    var other = state.prefs.filter(has);
    if (other.length === 1) lotInput(card, 'prefecture').value = other[0];
  }

  /** 市区町村欄の入力候補（候補にない市区町村も入力可） */
  function fillCityList() {
    var list = $('cityList');
    list.innerHTML = '';
    var names = [];
    state.prefs.forEach(function (p) {
      cityEntries(p).forEach(function (c) { if (names.indexOf(c.name) < 0) names.push(c.name); });
    });
    names.forEach(function (n) { list.appendChild(el('option', { value: n })); });
  }

  /** 都市計画税を課していない市町村では、課税明細書による区域の目安が使えない旨を出す */
  function updateTaxNote(card) {
    var city = lotInput(card, 'municipality').value.trim();
    var map = state.noCityPlanningTax[lotPref(card)] || {};
    var note = cq(card, '.tax-note');
    note.textContent = Object.prototype.hasOwnProperty.call(map, city)
      ? '※ ' + city + 'は都市計画税を課していないため' + map[city] + '、課税明細書では区域を判断できません。都市計画図でご確認ください。' : '';
    note.classList.toggle('hidden', !note.textContent);
  }

  function setLink(a, url) {
    if (url) { a.href = url; a.classList.remove('hidden'); }
    else { a.removeAttribute('href'); a.classList.add('hidden'); }
  }

  // ---------------------------------------------------------
  // 謄本の読み取り結果を物件カードへ反映
  // ---------------------------------------------------------
  /**
   * 読み取った物件を反映する。人が入力済みの欄は上書きしない。
   *  ・同じ地番のカードがあればそこへ
   *  ・なければ空のカード（所在・地番・面積が空）へ
   *  ・それもなければ新しいカードを追加
   * @return {number} 1つ以上の欄を埋めたカードの数
   */
  function applyTohon(cands) {
    var filled = 0;
    cands.forEach(function (c) {
      var lots = qsa('.lot');
      var card = lots.filter(function (k) { return c.lotNumber && splitLotNumber(lotInput(k, 'address').value).lotNumber === c.lotNumber; })[0] ||
        lots.filter(function (k) { return !lotInput(k, 'municipality').value && !lotInput(k, 'address').value && !lotInput(k, 'area').value; })[0] ||
        addLot();
      if (!card) return;
      var any = false;
      // 謄本の所在「豊田市○○町字△△」を、マスタの市区町村名との前方一致で 市区町村／町名・字 に分ける（一致しなければ全体を所在・地番欄へ）
      var place = c.address || '';
      var hit = cityPrefixOf(place, lotPref(card));
      if (!hit) {
        // 物件の都道府県で見つからず、ほかの1県だけに当てはまる市町村名なら、都道府県を切り替える（名前の一致のみ・推測なし）
        var other = state.prefs.filter(function (p) { return p !== lotPref(card) && cityPrefixOf(place, p); });
        if (other.length === 1) {
          lotInput(card, 'prefecture').value = other[0];
          hit = cityPrefixOf(place, other[0]);
        }
      }
      var city = hit ? hit.name : '';
      if (hit) place = place.slice(hit.length).trim();
      var addrText = [place, c.lotNumber].filter(String).join(' ');
      [['municipality', city], ['address', addrText], ['chimoku', c.chimoku], ['area', c.area]].forEach(function (kv) {
        var input = lotInput(card, kv[0]);
        if (kv[1] && !input.value) {
          input.value = kv[1];
          input.classList.add('from-tohon');
          any = true;
        }
      });
      if (any) {
        filled++;
        card.setAttribute('data-tohon', '1');
        var badge = cq(card, '.badge');
        badge.textContent = '謄本から読取・要確認' + (c.chimokuRaw && c.chimokuRaw !== c.chimoku ? '（謄本の地目：' + c.chimokuRaw + '）' : '');
        badge.classList.remove('hidden');
        updateLotLinks(card);
        updateCallBox(card);
        updateTaxNote(card);
        checkNonFarm(card);
      }
    });
    schedulePreview();
    return filled;
  }

  // ---------------------------------------------------------
  // 資料カード・ファイルアップロード
  // ---------------------------------------------------------
  function renderDocs(types) {
    var box = $('docs');
    box.innerHTML = '';
    types.forEach(function (type, i) {
      var card = el('div', { 'class': 'doc' });
      var head = el('div', { 'class': 'doc-head' });
      head.appendChild(el('b', {}, type));
      if (type === 'その他') {
        head.appendChild(el('input', { type: 'text', id: 'documentsOther', maxlength: '100', placeholder: '資料名（例：測量図）', 'aria-label': 'その他の資料名' }));
      }
      card.appendChild(head);

      var drop = el('div', { 'class': 'drop', tabindex: '0', role: 'button' },
        type === TOHON ? 'ドラッグまたはクリック（所在・地番等も読取）' : 'ドラッグまたはクリックで添付');
      var input = el('input', { type: 'file', multiple: 'multiple', accept: state.upload.mimeTypes.join(','), 'class': 'hidden' });
      setupDropArea(drop, input, function (files) { addFiles(type, files); });
      card.appendChild(drop);
      card.appendChild(input);
      card.appendChild(el('ul', { 'class': 'files', 'data-type': type }));
      box.appendChild(card);
    });
  }

  /**
   * ファイルを受け付ける。まとめて入れても、同時に処理するのは UPLOAD_CONCURRENCY 件まで
   * （残りは「待機中」として順番に処理。サーバーの同時実行数の上限に当たらないようにするため）。
   */
  var UPLOAD_CONCURRENCY = 3;
  var uploadQueue = [], uploadActive = 0;

  function addFiles(docType, fileList) {
    var files = Array.prototype.slice.call(fileList);
    // 謄本はファイル名の順（数字は数として比較）に並べ、読み取り結果もこの順に物件へ入れる
    // （ドラッグ時の並びはエクスプローラーの選び方で逆になることがあり、読み取りも並行で終わる順が変わるため）
    if (docType === TOHON) files.sort(function (a, b) { return a.name.localeCompare(b.name, 'ja', { numeric: true }); });
    files.forEach(function (file) {
      var item = { localId: state.nextLocalId++, docType: docType, name: file.name, status: 'waiting' };
      state.uploads.push(item);
      if (state.upload.mimeTypes.indexOf(file.type) < 0) {
        item.status = 'error'; item.error = 'PDF・画像のみ';
      } else if (file.size > state.upload.maxMb * 1024 * 1024) {
        item.status = 'error'; item.error = state.upload.maxMb + 'MB超';
      } else {
        if (docType === TOHON) tohonOrder.push(item);
        uploadQueue.push(function (done) { uploadOne(item, file, done); });
      }
    });
    pumpUploads();
    renderFiles();
    schedulePreview();
  }

  function pumpUploads() {
    while (uploadActive < UPLOAD_CONCURRENCY && uploadQueue.length) {
      uploadActive++;
      uploadQueue.shift()(function () { uploadActive--; pumpUploads(); });
    }
  }

  /** 1ファイルをアップロードし、謄本なら続けて読み取る。終わったら（成功・失敗とも）done を呼ぶ */
  function uploadOne(item, file, done) {
    item.status = 'uploading';
    renderFiles();
    var fail = function (msg) { item.status = 'error'; item.error = msg; item.tohonReady = true; flushTohon(); renderFiles(); done(); };
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = String(reader.result).split(',')[1] || '';
      google.script.run
        .withSuccessHandler(function (res) {
          item.fileId = res.fileId;
          if (item.docType === TOHON) { readTohonFile(item, done); } else { item.status = 'done'; renderFiles(); done(); }
        })
        .withFailureHandler(function (err) { fail(err.message); })
        .uploadAttachment({ name: file.name, mimeType: file.type, data: base64 });
    };
    reader.onerror = function () { fail('読み込み失敗'); };
    reader.readAsDataURL(file);
  }

  /** 謄本はアップロード後に読み取りを行う（読み取りに失敗してもアップロード自体は有効） */
  function readTohonFile(item, done) {
    item.status = 'reading';
    renderFiles();
    google.script.run
      .withSuccessHandler(function (res) {
        item.tohonResult = res; item.tohonReady = true;
        flushTohon();
        done();
      })
      .withFailureHandler(function (err) { item.tohonError = err.message; item.tohonReady = true; flushTohon(); done(); })
      .readTohon(item.fileId);
  }

  /** 読み取りが終わった謄本を、ファイル名の順に物件へ入れる（前の謄本が終わるまで待つ） */
  var tohonOrder = [];
  function flushTohon() {
    while (tohonOrder.length && tohonOrder[0].tohonReady) {
      var item = tohonOrder.shift();
      if (item.status === 'error') continue; // アップロードに失敗したもの
      item.status = 'done';
      if (item.tohonError) {
        item.note = '読み取りに失敗：' + item.tohonError;
      } else {
        var res = item.tohonResult || {};
        var found = (res.lots || []).length;
        var filled = applyTohon(res.lots || []);
        item.note = found && !filled ? '読み取り済み（入力済みの欄は変更していません）' : res.message;
      }
    }
    renderFiles();
  }

  function removeUpload(localId) {
    var item = state.uploads.filter(function (u) { return u.localId === localId; })[0];
    if (!item || item.status !== 'done' && item.status !== 'error') return;
    if (item.fileId) google.script.run.removeAttachment(item.fileId); // 失敗しても一時フォルダに残るだけ
    state.uploads = state.uploads.filter(function (u) { return u.localId !== localId; });
    renderFiles();
  }

  function renderFiles() {
    qsa('ul.files').forEach(function (ul) {
      ul.innerHTML = '';
      state.uploads.filter(function (u) { return u.docType === ul.getAttribute('data-type'); }).forEach(function (u) {
        var li = el('li');
        li.appendChild(el('span', { 'class': 'name' }, u.name));
        var st = {
          waiting: '待機中…', uploading: 'アップロード中…', reading: '謄本を読み取り中…',
          done: u.note || 'アップロード済み', error: '失敗：' + u.error
        }[u.status];
        li.appendChild(el('span', { 'class': 'st' + (u.status === 'error' ? ' ng' : '') }, st));
        if (u.status === 'done' || u.status === 'error') {
          var btn = el('button', { type: 'button', 'aria-label': u.name + ' を取り消す', title: '取り消す' }, '×');
          btn.addEventListener('click', function () { removeUpload(u.localId); });
          li.appendChild(btn);
        }
        ul.appendChild(li);
      });
    });
  }

  // ---------------------------------------------------------
  // 入力値の取得・チェック
  // ---------------------------------------------------------
  function radioVal(name) {
    var e = document.querySelector('input[name="' + name + '"]:checked');
    return e ? e.value : '';
  }

  function hasFarmland() {
    return qsa('.lot').some(function (card) { return state.farmlandUses.indexOf(lotInput(card, 'landUse').value) >= 0; });
  }

  function updatePlanRequired() {
    $('planReq').classList.toggle('hidden', !hasFarmland());
  }

  function collectForm() {
    return {
      requesterName: $('requesterName').value,
      trust: $('trust').checked,
      extraLotFee: $('extraLotFee').checked,
      prefecture: qsa('.lot').length ? lotPref(qsa('.lot')[0]) : state.prefs[0],
      lots: qsa('.lot').map(getLotData),
      plan: $('plan').value,
      documentsOther: $('documentsOther') ? $('documentsOther').value : '',
      attachments: state.uploads
        .filter(function (u) { return u.status === 'done' && u.fileId; })
        .map(function (u) { return { fileId: u.fileId, docType: u.docType }; })
    };
  }

  /** 送信前のチェック（最終チェックはサーバー側でも行う）。最初のエラー項目を返す */
  function validateForm(f) {
    var errors = [], first = null;
    function check(ok, target, msg) {
      if (target) target.classList.toggle('invalid', !ok);
      if (!ok) { errors.push(msg); if (!first) first = target; }
    }
    check(!!f.requesterName.trim(), $('requesterName'), '依頼者名を入力してください。');
    qsa('.lot').forEach(function (card, i) {
      var d = f.lots[i], name = '物件' + (i + 1) + '：';
      check(!!d.municipality.trim(), lotInput(card, 'municipality'), name + '市区町村を入力してください。');
      check(!!d.lotNumber, lotInput(card, 'address'), name + '所在・地番の末尾に地番を入力してください（例：○○町字△△ 123番1）。');
      check(!!d.zone, cq(card, '.zones'), name + '区域区分を選択してください（不明なら「分からない」）。');
      var area = d.area.replace(/[,，]/g, '').trim();
      check(area === '' || (!isNaN(Number(area)) && Number(area) >= 0), lotInput(card, 'area'), name + '面積は0以上の数値で入力してください（単位：㎡）。');
    });
    check(!hasFarmland() || !!f.plan.trim(), $('plan'), '現況が農地の物件があるため、今後の転用計画を入力してください。');
    if (state.uploads.some(function (u) { return u.status !== 'done' && u.status !== 'error'; })) {
      errors.push('アップロード中・読み取り中のファイルがあります。完了してから送信してください。');
    }
    return { errors: errors, first: first };
  }

  function showErrors(errors) {
    $('formErrors').textContent = errors.join('\n');
    $('formErrors').classList.toggle('hidden', !errors.length);
  }

  // ---------------------------------------------------------
  // 概算見積のプレビュー
  // ---------------------------------------------------------
  function schedulePreview() {
    clearTimeout(state.previewTimer);
    state.previewTimer = setTimeout(requestPreview, 120); // 画面内で計算するので短い間隔で十分
  }

  function requestPreview() {
    // 見積の計算コード（Estimate.gs と同じもの）が画面にあれば、その場で計算する（サーバーへの問い合わせ不要）
    if (typeof calculateEstimate_ === 'function' && typeof normalizeInput_ === 'function') {
      try { renderEstimate(calculateEstimate_(normalizeInput_(collectForm()))); return; } catch (e) { /* 失敗したらサーバーで計算 */ }
    }
    var seq = ++state.previewSeq; // 古い応答で上書きしないための通し番号
    google.script.run
      .withSuccessHandler(function (est) { if (seq === state.previewSeq) renderEstimate(est); })
      .withFailureHandler(function () { /* プレビュー失敗は致命的でないため無視 */ })
      .previewEstimate(collectForm());
  }

  function renderEstimate(est) {
    $('estimateTotal').textContent = est.ok ? yen(est.total) : '―';
    var tbody = $('estimateItems');
    tbody.innerHTML = '';
    var row = function (label, amount, cls) {
      var tr = el('tr', cls ? { 'class': cls } : {});
      tr.appendChild(el('td', {}, label));
      tr.appendChild(el('td', {}, amount === null ? '' : yen(amount)));
      tbody.appendChild(tr);
    };
    var items = est.items || [];
    var fees = items.filter(function (it) { return it.kind !== 'cost'; });
    var costs = items.filter(function (it) { return it.kind === 'cost'; });
    if (fees.length) row('報酬', null, 'group');
    fees.forEach(function (it) { row(it.label, it.amount); });
    if (est.ok) {
      row('報酬 小計（税抜）', est.feeSubtotal, 'sub');
      row('消費税（' + Math.round((est.taxRate || 0) * 100) + '%）', est.tax, 'sub');
      row('報酬 計（税込）', est.feeTotal, 'sub');
    }
    if (costs.length) row('実費', null, 'group');
    costs.forEach(function (it) { row(it.label, it.amount); });
    if (est.ok && costs.length) row('実費 小計', est.costTotal, 'sub');
    if (est.ok) row('合計', est.total, 'sum');
    var ul = $('estimateNotes');
    ul.innerHTML = '';
    (est.notes || []).forEach(function (n) { ul.appendChild(el('li', {}, n)); });
  }

  function yen(n) {
    return '¥' + String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // ---------------------------------------------------------
  // 送信（確認画面なし）
  // ---------------------------------------------------------
  function submit(isRequest) {
    if (state.submitting) return; // 二重送信防止
    var f = collectForm();
    var v = validateForm(f);
    showErrors(v.errors);
    if (v.errors.length) {
      if (v.first) v.first.scrollIntoView({ block: 'center' });
      return;
    }

    setBusy(true, isRequest);
    google.script.run
      .withSuccessHandler(function (res) { setBusy(false); onSubmitted(res, isRequest, f.lots.length); })
      .withFailureHandler(function (err) { setBusy(false); showErrors(['送信に失敗しました：' + err.message]); })
      .submitCase(f, isRequest, state.editing ? state.editing.id : null);
  }

  function onSubmitted(res, isRequest, lotCount) {
    var lines = ['受付番号 ' + (res.caseNo || res.id) + ' として受け付けました（物件 ' + lotCount + ' 件）。'];
    var type = 'ok';
    if (res.fileCount) lines.push('資料ファイル ' + res.fileCount + ' 件を保存しました。');
    if (res.attachErrors && res.attachErrors.length) {
      type = 'warn';
      lines.push('※資料の保存で問題がありました：' + res.attachErrors.join(' / '));
    }
    if (isRequest) {
      if (res.notified) {
        lines.push('行政班へ見積調査依頼を通知しました。行政班からの連絡をお待ちください。');
      } else {
        type = 'warn';
        lines.push('※Chat への通知に失敗しました（' + res.notifyMessage + '）。お手数ですが、行政班へ受付番号を直接お伝えください。');
      }
    }
    lines.push('概算見積金額：' + (res.estimate.ok ? yen(res.estimate.total) : '算出不可') + '（目安）');
    if (res.edited) lines.unshift('（保存していた案件に上書きしました）');
    if (!isRequest) lines.push('続きは、画面右上の「保存した案件を開く」から入力できます。');
    state.editing = null;
    $('editBanner').classList.add('hidden');

    $('resultBox').className = 'result ' + type;
    $('resultTitle').textContent = isRequest ? '見積調査依頼を送信しました' : '保存しました';
    $('resultText').textContent = lines.join('\n');
    $('caseForm').classList.add('hidden');
    $('estimateBar').classList.add('hidden');
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------
  // 保存した案件の呼び出し
  // ---------------------------------------------------------
  function openSavedList() {
    var list = $('savedList');
    list.innerHTML = '';
    list.appendChild(el('p', { 'class': 'help' }, '読み込み中…'));
    $('savedDialog').showModal();
    google.script.run
      .withSuccessHandler(function (items) {
        list.innerHTML = '';
        if (!items.length) { list.appendChild(el('p', { 'class': 'help' }, '保存した案件はありません。')); return; }
        items.forEach(function (c) {
          var b = el('button', { type: 'button', 'class': 'saved-item' });
          b.appendChild(el('b', {}, (c.caseNo || '#' + c.id) + '　' + (c.requesterName || '（依頼者名なし）')));
          b.appendChild(el('span', {}, [c.address, c.lotNumber].filter(Boolean).join(' ') || '―'));
          b.appendChild(el('small', {}, '保存 ' + (c.updatedAt || '') + (c.mine ? '' : '　入力者 ' + c.submittedBy)));
          b.addEventListener('click', function () { loadSaved(c.id); });
          list.appendChild(b);
        });
      })
      .withFailureHandler(function (err) { list.innerHTML = ''; list.appendChild(el('p', { 'class': 'saved err' }, '読み込めませんでした：' + err.message)); })
      .listSavedCases();
  }

  function loadSaved(id) {
    var dirty = $('requesterName').value.trim() || qsa('.lot').some(function (k) { return lotInput(k, 'address').value.trim(); });
    if (dirty && !confirm('入力中の内容を消して、保存した案件を開きますか？')) return;
    google.script.run
      .withSuccessHandler(function (res) {
        $('savedDialog').close();
        fillForm(res.form);
        state.editing = { id: res.id, caseNo: res.caseNo };
        $('editNo').textContent = res.caseNo || ('#' + res.id);
        $('editFiles').textContent = (res.fileCount ? '（保存済みの資料 ' + res.fileCount + '件はそのまま残ります）' : '') +
          (res.rebuilt ? '※ この案件は保存時の入力が残っていないため、シートの内容から戻しました。受付期間などは備考欄に文字で入っています。確認してください。' : '');
        $('editBanner').classList.remove('hidden');
        window.scrollTo(0, 0);
      })
      .withFailureHandler(function (err) { alert('開けませんでした：' + err.message); })
      .getSavedCase(id);
  }

  /** 保存した入力内容を画面に戻す */
  function fillForm(f) {
    resetForm();
    $('requesterName').value = f.requesterName || '';
    $('trust').checked = !!f.trust;
    $('plan').value = f.plan || '';
    if ($('documentsOther') && f.documentsOther) $('documentsOther').value = f.documentsOther;
    var lots = f.lots && f.lots.length ? f.lots : [{}];
    $('lots').innerHTML = '';
    lots.forEach(function (d) { var card = addLot(); if (card) fillLot(card, d); });
    $('extraLotFee').checked = !!f.extraLotFee;
    renumberLots();
    updatePlanRequired();
    schedulePreview();
  }

  function fillLot(card, d) {
    if (d.prefecture) lotInput(card, 'prefecture').value = d.prefecture;
    Object.keys(d).forEach(function (k) {
      var v = d[k];
      if (k === 'kairyoExtra' || k === 'lotNumber' || k === 'prefecture') return;
      if (k === 'readFromTohon') {
        if (v) { card.setAttribute('data-tohon', '1'); cq(card, '.badge').classList.remove('hidden'); }
        return;
      }
      if (k === 'iinContacts' || k === 'localContacts' || k === 'drainContacts') { setContacts(card, k, v || []); return; }
      if (k === 'tenyoUkeMonths') { (v || []).forEach(function (x, i) { var e = lotInput(card, 'tenyoUkeM' + i); if (e) e.value = x; }); return; }
      if (k === 'noutiKubun') {
        var ks = Array.isArray(v) ? v : String(v || '').split('・');
        cqa(card, 'input[data-kubun]').forEach(function (x) { x.checked = ks.indexOf(x.value) >= 0; });
        return;
      }
      if (k === 'hinochiDocs') { cqa(card, '.hinochi-docs input[data-doc]').forEach(function (x) { x.checked = (v || []).indexOf(x.value) >= 0; }); return; }
      var e = lotInput(card, k);
      if (e) { if (e.type === 'checkbox') e.checked = !!v; else e.value = v === null || v === undefined ? '' : v; return; }
      setRadio(card, k, v);
    });
    if (d.isNoshin) card.removeAttribute('data-noshin-auto');
    (d.kairyoExtra || []).forEach(function (x) { addKairyoExtra(card, x); });
    updateLotLinks(card);
    updateCallBox(card);
    updateConvertedWarn(card);
    updateTaxNote(card);
  }

  function resetForm() {
    state.editing = null;
    $('editBanner').classList.add('hidden');
    $('caseForm').reset();
    $('lots').innerHTML = '';
    state.uploads = [];
    tohonOrder = [];
    addLot();
    renderFiles();
    updatePlanRequired();
    showErrors([]);
    qsa('.invalid').forEach(function (e) { e.classList.remove('invalid'); });
    $('resultBox').className = 'result hidden';
    $('caseForm').classList.remove('hidden');
    $('estimateBar').classList.remove('hidden');
    window.scrollTo(0, 0);
    requestPreview();
  }

  function setBusy(busy, isRequest) {
    state.submitting = busy;
    $('requestBtn').disabled = busy;
    $('saveOnlyBtn').disabled = busy;
    $('requestBtn').textContent = busy && isRequest ? '送信中…' : '見積調査依頼';
    $('saveOnlyBtn').textContent = busy && !isRequest ? '保存中…' : '保存のみ';
  }
</script>
