<script>
  /**
   * 依頼画面の処理
   *  ・選択肢の描画（選択肢そのものはサーバー側 Config.gs の FORM_OPTIONS が正）
   *  ・入力のたびに概算見積をサーバーで再計算して表示（計算は Estimate.gs のみ）
   *  ・資料ファイルのドラッグ＆ドロップ → 即アップロード（Drive の一時フォルダ）
   *  ・送信（確認画面なし・ボタンを押したらすぐ送信）
   */

  /** 区域カードの説明文（画面表示用） */
  var ZONE_HINTS = {
    '市街化区域':     { desc: '都市計画図で用途地域の色が塗られている区域', proc: '農地転用は「届出」' },
    '市街化調整区域': { desc: '線引きのある都市計画区域で、市街化区域以外の区域', proc: '農地転用は「許可」' },
    '非線引き区域':   { desc: '市街化区域・調整区域の区分がない区域（都市計画区域外を含む）', proc: '農地転用は「許可」' },
    '分からない':     { desc: '行政班が都市計画図で確認します', proc: '見積は「届出」で仮計算' }
  };

  var state = {
    master: [], options: null, farmlandUses: [], upload: null,
    uploads: [],        // { localId, docType, name, status:'uploading'|'done'|'error', fileId, error }
    nextLocalId: 1,
    previewTimer: null, previewSeq: 0, submitting: false
  };

  var $ = function (id) { return document.getElementById(id); };

  // ---------------------------------------------------------
  // 初期化
  // ---------------------------------------------------------
  document.addEventListener('DOMContentLoaded', function () {
    google.script.run
      .withSuccessHandler(init)
      .withFailureHandler(function (err) { showErrors(['初期データの読み込みに失敗しました：' + err.message]); })
      .getInitialData();
  });

  function init(data) {
    state.master = data.master || [];
    state.options = data.options;
    state.farmlandUses = data.farmlandUses || [];
    state.upload = data.upload;
    if (data.userEmail) $('userInfo').textContent = 'ログイン中：' + data.userEmail;

    var o = data.options;
    fillSelect('chimoku', o.chimoku, '選択してください');
    fillSelect('landUse', o.landUses, '選択してください');
    renderZones(o.zones);
    renderChoices('isNoshinChoices', 'isNoshin', o.yesNoUnknown);
    renderChoices('isConvertedChoices', 'isConverted', o.yesNo);
    renderChoices('landImprovementChoices', 'landImprovement', o.yesNoUnknown);
    renderChoices('waterAssociationChoices', 'waterAssociation', o.yesNoUnknown);
    renderDocs(o.documents);
    $('uploadHelp').textContent += '（PDF・画像、1ファイル' + data.upload.maxMb + 'MBまで）';

    // 都道府県：既定値（愛知県）を先頭に、マスタにある都道府県を並べる
    var prefs = [data.defaultPrefecture];
    state.master.forEach(function (m) { if (prefs.indexOf(m.prefecture) < 0) prefs.push(m.prefecture); });
    prefs.forEach(function (p, i) { $('prefecture').appendChild(new Option(p, p, i === 0, i === 0)); });

    bindEvents();
    updatePlanRequired();
    requestPreview();
  }

  function bindEvents() {
    var form = $('caseForm');
    form.addEventListener('change', schedulePreview);
    form.addEventListener('input', schedulePreview);
    form.addEventListener('submit', function (e) { e.preventDefault(); });
    $('prefecture').addEventListener('change', onAddressChange);
    $('address').addEventListener('input', onAddressChange);
    $('landUse').addEventListener('change', updatePlanRequired);
    $('requestBtn').addEventListener('click', function () { submit(true); });
    $('saveOnlyBtn').addEventListener('click', function () { submit(false); });
    $('toDetail').addEventListener('click', function () { $('detail').scrollIntoView({ block: 'start' }); });
    $('againBtn').addEventListener('click', resetForm);
  }

  // ---------------------------------------------------------
  // 画面部品の描画
  // ---------------------------------------------------------
  function fillSelect(id, values, placeholder) {
    var sel = $(id);
    sel.innerHTML = '';
    sel.appendChild(new Option(placeholder, ''));
    values.forEach(function (v) { sel.appendChild(new Option(v, v)); });
  }

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderZones(zones) {
    var box = $('zoneChoices');
    box.innerHTML = '';
    zones.forEach(function (z) {
      var hint = ZONE_HINTS[z] || { desc: '', proc: '' };
      var label = el('label', { 'class': 'zone' + (z === '分からない' ? ' unknown' : '') });
      label.appendChild(el('input', { type: 'radio', name: 'zone', value: z }));
      var span = el('span');
      span.appendChild(el('b', {}, z));
      span.appendChild(el('small', {}, hint.desc));
      span.appendChild(el('em', {}, hint.proc));
      label.appendChild(span);
      box.appendChild(label);
    });
  }

  function renderChoices(containerId, name, values) {
    var box = $(containerId);
    box.innerHTML = '';
    values.forEach(function (v) {
      var label = el('label');
      label.appendChild(el('input', { type: 'radio', name: name, value: v }));
      label.appendChild(document.createTextNode(v));
      box.appendChild(label);
    });
  }

  /** 資料種別ごとのカード（チェック＋ドロップ枠＋ファイル一覧） */
  function renderDocs(types) {
    var box = $('docs');
    box.innerHTML = '';
    types.forEach(function (type, i) {
      var card = el('div', { 'class': 'doc' });
      var head = el('div', { 'class': 'doc-head' });
      head.appendChild(el('b', {}, type));
      var chkLabel = el('label');
      var chk = el('input', { type: 'checkbox', name: 'documents', value: type, id: 'doc' + i });
      chkLabel.appendChild(chk);
      chkLabel.appendChild(document.createTextNode('手元にある'));
      head.appendChild(chkLabel);
      if (type === 'その他') {
        head.appendChild(el('input', { type: 'text', id: 'documentsOther', maxlength: '100', placeholder: '資料名（例：測量図）', 'aria-label': 'その他の資料名' }));
      }
      card.appendChild(head);

      var drop = el('div', { 'class': 'drop', tabindex: '0', role: 'button' }, 'ここにファイルをドラッグ、またはクリックして選択');
      var input = el('input', { type: 'file', multiple: 'multiple', accept: state.upload.mimeTypes.join(','), 'class': 'hidden' });
      drop.addEventListener('click', function () { input.click(); });
      drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
      drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
      drop.addEventListener('drop', function (e) {
        e.preventDefault(); drop.classList.remove('over');
        addFiles(type, e.dataTransfer.files, chk);
      });
      input.addEventListener('change', function () { addFiles(type, input.files, chk); input.value = ''; });
      card.appendChild(drop);
      card.appendChild(input);
      card.appendChild(el('ul', { 'class': 'files', 'data-type': type }));
      box.appendChild(card);
    });
    // 枠の外にファイルを落としてもブラウザでファイルが開かないようにする
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); });
  }

  // ---------------------------------------------------------
  // ファイルアップロード
  // ---------------------------------------------------------
  function addFiles(docType, fileList, checkbox) {
    Array.prototype.forEach.call(fileList, function (file) {
      var item = { localId: state.nextLocalId++, docType: docType, name: file.name, status: 'uploading' };
      state.uploads.push(item);
      if (state.upload.mimeTypes.indexOf(file.type) < 0) {
        item.status = 'error'; item.error = 'PDF・画像のみ';
      } else if (file.size > state.upload.maxMb * 1024 * 1024) {
        item.status = 'error'; item.error = state.upload.maxMb + 'MB超';
      } else {
        uploadOne(item, file);
      }
    });
    checkbox.checked = true;
    renderFiles();
    schedulePreview();
  }

  function uploadOne(item, file) {
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = String(reader.result).split(',')[1] || '';
      google.script.run
        .withSuccessHandler(function (res) { item.status = 'done'; item.fileId = res.fileId; renderFiles(); })
        .withFailureHandler(function (err) { item.status = 'error'; item.error = err.message; renderFiles(); })
        .uploadAttachment({ name: file.name, mimeType: file.type, data: base64 });
    };
    reader.onerror = function () { item.status = 'error'; item.error = '読み込み失敗'; renderFiles(); };
    reader.readAsDataURL(file);
  }

  function removeUpload(localId) {
    var item = state.uploads.filter(function (u) { return u.localId === localId; })[0];
    if (!item || item.status === 'uploading') return;
    if (item.fileId) google.script.run.removeAttachment(item.fileId); // 失敗しても一時フォルダに残るだけ
    state.uploads = state.uploads.filter(function (u) { return u.localId !== localId; });
    renderFiles();
  }

  function renderFiles() {
    Array.prototype.forEach.call(document.querySelectorAll('ul.files'), function (ul) {
      ul.innerHTML = '';
      state.uploads.filter(function (u) { return u.docType === ul.getAttribute('data-type'); }).forEach(function (u) {
        var li = el('li');
        li.appendChild(el('span', { 'class': 'name' }, u.name));
        var st = u.status === 'uploading' ? 'アップロード中…' : u.status === 'done' ? 'アップロード済み' : '失敗：' + u.error;
        li.appendChild(el('span', { 'class': 'st' + (u.status === 'error' ? ' ng' : '') }, st));
        if (u.status !== 'uploading') {
          var btn = el('button', { type: 'button', 'aria-label': u.name + ' を取り消す', title: '取り消す' }, '×');
          btn.addEventListener('click', function () { removeUpload(u.localId); });
          li.appendChild(btn);
        }
        ul.appendChild(li);
      });
    });
  }

  // ---------------------------------------------------------
  // 市区町村・現況に応じた表示切り替え
  // ---------------------------------------------------------
  /**
   * 所在の先頭がマスタの市区町村名と一致したら、その市区町村の参照用リンクを出す。
   * （文字列の前方一致だけ。区域などの判定はしない）
   */
  function onAddressChange() {
    var row = findMasterRow($('prefecture').value, $('address').value);
    setLink('cityPlanLink', row && row.cityPlanUrl);
    setLink('noshinLink', row && row.noshinUrl);
  }

  function findMasterRow(pref, address) {
    var a = address.trim();
    if (a.indexOf(pref) === 0) a = a.slice(pref.length); // 「愛知県豊田市…」と書かれた場合
    return state.master
      .filter(function (m) { return m.prefecture === pref && a.indexOf(m.municipality) === 0; })
      .sort(function (x, y) { return y.municipality.length - x.municipality.length; })[0]; // 長い名前を優先
  }

  function setLink(id, url) {
    var a = $(id);
    if (url) { a.href = url; a.classList.remove('hidden'); }
    else { a.removeAttribute('href'); a.classList.add('hidden'); }
  }

  function isFarmland() { return state.farmlandUses.indexOf($('landUse').value) >= 0; }

  function updatePlanRequired() {
    $('planReq').classList.toggle('hidden', !isFarmland());
  }

  // ---------------------------------------------------------
  // 入力値の取得・チェック
  // ---------------------------------------------------------
  function radioVal(name) {
    var e = document.querySelector('input[name="' + name + '"]:checked');
    return e ? e.value : '';
  }

  function collectForm() {
    return {
      requesterName: $('requesterName').value,
      prefecture: $('prefecture').value,
      address: $('address').value,
      lotNumber: $('lotNumber').value,
      chimoku: $('chimoku').value,
      area: $('area').value,
      zone: radioVal('zone'),
      isNoshin: radioVal('isNoshin'),
      landUse: $('landUse').value,
      landUseOther: $('landUseOther').value,
      isConverted: radioVal('isConverted'),
      plan: $('plan').value,
      landImprovement: radioVal('landImprovement'),
      waterAssociation: radioVal('waterAssociation'),
      documents: Array.prototype.map.call(document.querySelectorAll('input[name="documents"]:checked'), function (e) { return e.value; }),
      documentsOther: $('documentsOther') ? $('documentsOther').value : '',
      attachments: state.uploads
        .filter(function (u) { return u.status === 'done'; })
        .map(function (u) { return { fileId: u.fileId, docType: u.docType }; })
    };
  }

  /** 送信前のチェック（最終チェックはサーバー側でも行う）。最初のエラー項目を返す */
  function validateForm(f) {
    var errors = [], first = null;
    function check(ok, id, msg) {
      if (id) $(id).classList.toggle('invalid', !ok);
      if (!ok) { errors.push(msg); if (!first) first = id ? $(id) : $('zoneChoices'); }
    }
    check(!!f.requesterName.trim(), 'requesterName', '依頼者名を入力してください。');
    check(!!f.lotNumber.trim(), 'lotNumber', '地番を入力してください。');
    check(!!f.zone, null, '区域区分を選択してください（不明なら「分からない」）。');
    var area = f.area.replace(/[,，]/g, '').trim();
    check(area === '' || (!isNaN(Number(area)) && Number(area) >= 0), 'area', '面積は0以上の数値で入力してください（単位：㎡）。');
    check(!isFarmland() || !!f.plan.trim(), 'plan', '現況が農地の場合は、今後の転用計画を入力してください。');
    if (state.uploads.some(function (u) { return u.status === 'uploading'; })) {
      errors.push('アップロード中のファイルがあります。完了してから送信してください。');
    }
    return { errors: errors, first: first };
  }

  function showErrors(errors) {
    $('formErrors').textContent = errors.join('\n');
    $('formErrors').classList.toggle('hidden', !errors.length);
  }

  // ---------------------------------------------------------
  // 概算見積のプレビュー
  // ---------------------------------------------------------
  function schedulePreview() {
    clearTimeout(state.previewTimer);
    state.previewTimer = setTimeout(requestPreview, 400);
  }

  function requestPreview() {
    var seq = ++state.previewSeq; // 古い応答で上書きしないための通し番号
    google.script.run
      .withSuccessHandler(function (est) { if (seq === state.previewSeq) renderEstimate(est); })
      .withFailureHandler(function () { /* プレビュー失敗は致命的でないため無視 */ })
      .previewEstimate(collectForm());
  }

  function renderEstimate(est) {
    $('estimateTotal').textContent = est.ok ? yen(est.total) : '―';
    var tbody = $('estimateItems');
    tbody.innerHTML = '';
    (est.items || []).forEach(function (it) {
      var tr = el('tr');
      tr.appendChild(el('td', {}, it.label));
      tr.appendChild(el('td', {}, yen(it.amount)));
      tbody.appendChild(tr);
    });
    if (est.ok) {
      var sum = el('tr', { 'class': 'sum' });
      sum.appendChild(el('td', {}, '合計'));
      sum.appendChild(el('td', {}, yen(est.total)));
      tbody.appendChild(sum);
    }
    var ul = $('estimateNotes');
    ul.innerHTML = '';
    (est.notes || []).forEach(function (n) { ul.appendChild(el('li', {}, n)); });
  }

  function yen(n) {
    return '¥' + String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // ---------------------------------------------------------
  // 送信（確認画面なし）
  // ---------------------------------------------------------
  function submit(isRequest) {
    if (state.submitting) return; // 二重送信防止
    var f = collectForm();
    var v = validateForm(f);
    showErrors(v.errors);
    if (v.errors.length) {
      if (v.first) v.first.scrollIntoView({ block: 'center' });
      return;
    }

    setBusy(true, isRequest);
    google.script.run
      .withSuccessHandler(function (res) { setBusy(false); onSubmitted(res, isRequest); })
      .withFailureHandler(function (err) { setBusy(false); showErrors(['送信に失敗しました：' + err.message]); })
      .submitCase(f, isRequest);
  }

  function onSubmitted(res, isRequest) {
    var lines = ['案件ID ' + res.id + ' として受け付けました。'];
    var type = 'ok';
    if (res.fileCount) lines.push('資料ファイル ' + res.fileCount + ' 件を保存しました。');
    if (res.attachErrors && res.attachErrors.length) {
      type = 'warn';
      lines.push('※資料の保存で問題がありました：' + res.attachErrors.join(' / '));
    }
    if (isRequest) {
      if (res.notified) {
        lines.push('行政班へ見積調査依頼を通知しました。行政班からの連絡をお待ちください。');
      } else {
        type = 'warn';
        lines.push('※Chat への通知に失敗しました（' + res.notifyMessage + '）。お手数ですが、行政班へ案件IDを直接お伝えください。');
      }
    }
    lines.push('概算見積金額：' + (res.estimate.ok ? yen(res.estimate.total) : '算出不可') + '（目安）');

    $('resultBox').className = 'result ' + type;
    $('resultTitle').textContent = isRequest ? '見積調査依頼を送信しました' : '保存しました';
    $('resultText').textContent = lines.join('\n');
    $('caseForm').classList.add('hidden');
    $('estimateBar').classList.add('hidden');
    window.scrollTo(0, 0);
  }

  function resetForm() {
    $('caseForm').reset();
    state.uploads = [];
    renderFiles();
    onAddressChange();
    updatePlanRequired();
    showErrors([]);
    Array.prototype.forEach.call(document.querySelectorAll('.invalid'), function (e) { e.classList.remove('invalid'); });
    $('resultBox').className = 'result hidden';
    $('caseForm').classList.remove('hidden');
    $('estimateBar').classList.remove('hidden');
    window.scrollTo(0, 0);
    requestPreview();
  }

  function setBusy(busy, isRequest) {
    state.submitting = busy;
    $('requestBtn').disabled = busy;
    $('saveOnlyBtn').disabled = busy;
    $('requestBtn').textContent = busy && isRequest ? '送信中…' : '見積調査依頼';
    $('saveOnlyBtn').textContent = busy && !isRequest ? '保存中…' : '保存のみ';
  }
</script>
