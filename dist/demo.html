<title>マンスリー周辺調査</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
/* 作業台レイアウト: 左に物件の列（作業待ちの山）、右に1物件ずつ5工程で進める作業面。主操作は常に右下の固定バー */
:root {
  --paper: #eef2f2;
  --surface: #ffffff;
  --surface-2: #f6f9f9;
  --ink: #16232a;
  --muted: #546770;
  --line: #d3dcde;
  --accent: #1c5a85;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf5;
  --ok: #17703f;
  --ok-soft: #e1f2e8;
  --warn: #7f5200;
  --warn-soft: #fff1d2;
  --warn-line: #e8c46a;
  --danger: #b3261e;
  --danger-soft: #fce8e6;
  --focus: #e8a400;
  --shadow: 0 1px 2px rgba(22, 35, 42, .08), 0 4px 14px rgba(22, 35, 42, .06);
  --font-ui: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-num: "BIZ UDGothic", "Hiragino Kaku Gothic ProN", ui-monospace, monospace;
  --r: 10px;
  --tap: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161a; --surface: #172127; --surface-2: #1c2830; --ink: #e5edef; --muted: #9db0b8; --line: #2c3c44;
    --accent: #74b4e0; --accent-ink: #0a1822; --accent-soft: #1b3445; --ok: #63c98f; --ok-soft: #15301f;
    --warn: #f2c56a; --warn-soft: #362a10; --warn-line: #7a6024; --danger: #f28b82; --danger-soft: #3b1a17;
    --focus: #f2c94c; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161a; --surface: #172127; --surface-2: #1c2830; --ink: #e5edef; --muted: #9db0b8; --line: #2c3c44;
  --accent: #74b4e0; --accent-ink: #0a1822; --accent-soft: #1b3445; --ok: #63c98f; --ok-soft: #15301f;
  --warn: #f2c56a; --warn-soft: #362a10; --warn-line: #7a6024; --danger: #f28b82; --danger-soft: #3b1a17;
  --focus: #f2c94c; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.65 var(--font-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- 枠組み ---------- */
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 14px; }
.topbar .spacer { flex: 1; }
.demo-band { background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--warn-line); font-size: 13px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---------- 物件一覧 ---------- */
.queue { border-right: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; min-height: 0; }
@media (max-width: 900px) { .queue { border-right: 0; border-bottom: 1px solid var(--line); } .queue.collapsed .queue-body { display: none; } }
.queue-head { display: grid; gap: 10px; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 10px; }
.queue-toggle { display: none; }
@media (max-width: 900px) { .queue-toggle { display: inline-flex; } }
.queue-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.queue-list { list-style: none; margin: 0; padding: 4px 10px 16px; overflow: auto; display: grid; gap: 6px; align-content: start; }
@media (max-width: 900px) { .queue-list { max-height: 45vh; } }
.q-item { width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: var(--r); padding: 10px 12px; cursor: pointer;
  display: grid; gap: 4px; min-height: var(--tap); }
.q-item:hover { background: var(--surface); border-color: var(--line); }
.q-item[aria-current="true"] { background: var(--surface); border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.q-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-addr { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-empty { color: var(--muted); padding: 16px; font-size: 14px; }

/* 状態ピル（色だけに頼らず、記号と文字を併記） */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 2px 10px 2px 8px; border-radius: 999px; width: fit-content; }
.pill .dot { font-family: var(--font-num); }
.pill.s1, .pill.s2, .pill.s3 { background: var(--accent-soft); color: var(--accent); }
.pill.s4 { background: var(--warn-soft); color: var(--warn); }
.pill.s5 { background: var(--ok-soft); color: var(--ok); }

/* ---------- ボタン・入力 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { min-height: 52px; padding: 0 26px; font-size: 16px; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.input, .select, .textarea { width: 100%; min-height: var(--tap); padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.textarea { min-height: 120px; resize: vertical; line-height: 1.7; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); outline-offset: 0; }
.input.missing { border-color: var(--warn-line); background: var(--warn-soft); }
.search { min-height: 40px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- 作業面 ---------- */
.work { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.work-scroll { flex: 1; overflow: auto; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.work-inner { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }
.prop-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.prop-head h1 { margin: 0; font-size: 22px; line-height: 1.35; text-wrap: balance; }
.prop-head .sub { color: var(--muted); font-size: 13.5px; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; counter-reset: s; }
.step { position: relative; }
.step button { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-align: left; }
.step .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700;
  background: var(--surface-2); border: 1px solid var(--line); }
.step .t { display: grid; line-height: 1.3; min-width: 0; }
.step .t b { font-size: 14.5px; }
.step .t small { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step.done .n { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.step.current button { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.step.current .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step button[disabled] { cursor: not-allowed; opacity: .55; }
@media (max-width: 720px) { .step .t small { display: none; } .step button { justify-content: center; padding: 6px; } .step .t b { font-size: 12.5px; } .step button { flex-direction: column; gap: 4px; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card h2 { margin: 0; font-size: 16.5px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h2 .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 700; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.req { font-size: 11px; font-weight: 700; color: var(--danger); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
.help { color: var(--muted); font-size: 12.5px; }
.station-row { display: grid; grid-template-columns: 40px minmax(0, 1.2fr) minmax(0, 1fr) 110px; gap: 10px; align-items: center; }
.station-row .idx { font-family: var(--font-num); color: var(--muted); text-align: center; }
@media (max-width: 720px) { .station-row { grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr); } .station-row .walk { grid-column: 2 / -1; } }
.unit { display: flex; align-items: center; gap: 8px; }
.unit .input { max-width: 120px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: var(--tap); display: inline-flex; align-items: center; gap: 8px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 700; }
.chip .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: transparent; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] .ck { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r); font-size: 14px; align-items: flex-start; }
.note .ic { flex: none; font-weight: 700; font-family: var(--font-num); }
.note.info { background: var(--accent-soft); color: var(--ink); }
.note.info .ic { color: var(--accent); }
.note.warn { background: var(--warn-soft); border: 1px solid var(--warn-line); }
.note.warn .ic { color: var(--warn); }
.note.ok { background: var(--ok-soft); }
.note.ok .ic { color: var(--ok); }
.note.err { background: var(--danger-soft); }
.note.err .ic { color: var(--danger); }
.note p { margin: 0; }

/* ---------- 地図 ---------- */
.map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .map-wrap { grid-template-columns: minmax(0, 1fr); } }
.map { position: relative; width: 100%; max-width: 100%; aspect-ratio: 640 / 400; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); cursor: crosshair; }
.map img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.pin { position: absolute; width: 34px; height: 46px; transform: translate(-50%, -100%); pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.map-tools { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; }
.map-tools button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 700; cursor: pointer; }
.map-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
.coord { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.coord dt { color: var(--muted); }
.coord dd { margin: 0; }

/* ---------- 調査 ---------- */
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.plan div { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface-2); }
.plan b { display: block; }
.plan span { color: var(--muted); font-size: 13px; }
.progress { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.progress i { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 999px; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

/* ---------- 確認 ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { min-height: var(--tap); padding: 0 16px; border: 0; background: transparent; cursor: pointer; font-weight: 700; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font-family: var(--font-num); font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.count.zero { background: var(--ok-soft); color: var(--ok); }
.review-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cat { display: grid; gap: 8px; }
.cat-head { display: flex; align-items: baseline; gap: 10px; }
.cat-head h3 { margin: 0; font-size: 15.5px; }
.cat-head span { color: var(--muted); font-size: 13px; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.row.flagged { border-color: var(--warn-line); }
.row.off .r-name { color: var(--muted); }
.r-main { min-width: 0; display: grid; gap: 2px; }
.r-name { font-weight: 700; overflow-wrap: anywhere; }
.r-meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
.r-dist { text-align: right; font-family: var(--font-num); font-weight: 700; font-size: 15px; white-space: nowrap; }
.r-dist small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.r-flag { grid-column: 2 / -1; display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap;
  background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; }
.r-flag.done { background: var(--ok-soft); }
@media (max-width: 600px) { .row { grid-template-columns: auto minmax(0, 1fr); } .r-dist { grid-column: 2; text-align: left; } .r-flag { grid-column: 1 / -1; } }
.switch { position: relative; width: 52px; height: 30px; border-radius: 999px; border: 0; background: var(--line); cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.switch-wrap { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 13.5px; min-height: 36px; display: flex; align-items: center; }
.tag { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.tag.g { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* ---------- 出力 ---------- */
.out-item { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 10px 16px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
.out-item:first-child { border-top: 0; }
@media (max-width: 720px) { .out-item { grid-template-columns: minmax(0, 1fr) auto; } .out-item .out-val { grid-column: 1 / -1; grid-row: 2; } }
.out-label { font-weight: 700; font-size: 13.5px; color: var(--muted); padding-top: 4px; }
.out-val { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.out-val.empty { color: var(--muted); }
.meter { display: grid; gap: 4px; margin-top: 8px; }
.meter-bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.meter-bar i { display: block; height: 100%; background: var(--ok); }
.meter-bar i.over { background: var(--danger); }
.meter small { color: var(--muted); font-size: 12px; }
.howto { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
.handoff { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }

/* ---------- 下部の固定操作バー ---------- */
.actionbar { position: sticky; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(0,0,0,.04);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.actionbar-inner { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.actionbar .msg { flex: 1; min-width: 0; color: var(--muted); font-size: 13.5px; }
.saved { font-size: 12.5px; color: var(--muted); }
.saved.ok { color: var(--ok); }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--surface);
  padding: 10px 18px; border-radius: 10px; font-weight: 700; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.drop { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--accent) 18%, transparent); display: grid; place-items: center; pointer-events: none; }
.drop div { background: var(--surface); border: 3px dashed var(--accent); border-radius: 16px; padding: 28px 36px; font-size: 18px; font-weight: 700; color: var(--accent); }
.empty-state { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 60px 16px; color: var(--muted); }
.empty-state h2 { color: var(--ink); margin: 0; }
.inline-form { display: flex; gap: 8px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">周</span>マンスリー周辺調査</div>
    <div class="spacer"></div>
    <button class="btn small queue-toggle" id="queue-toggle" type="button" aria-controls="queue" aria-expanded="true">物件一覧</button>
  </header>
  <div class="demo-band" id="demo-band" hidden>デモ版：架空のサンプルデータで動いています。Google API・スプレッドシート・ウェルモには接続しません。</div>
  <div class="layout">
    <aside class="queue" id="queue" aria-label="物件一覧">
      <div class="queue-head">
        <button class="btn primary" type="button" id="btn-upload">＋ マイソクPDFを追加</button>
        <input type="file" id="file-input" accept="application/pdf" class="sr" tabindex="-1" aria-hidden="true">
        <div id="manual-add"></div>
        <label class="sr" for="q-search">物件を検索</label>
        <input class="input search" id="q-search" type="search" placeholder="建物名・住所で検索">
        <div class="seg" role="group" aria-label="表示する物件" id="q-filter">

/**
 * 01_Util.js
 * 汎用関数（GASサービスに依存しない純粋関数。Node.jsのテストからも読み込む）。
 */

var JST_OFFSET_MS = 9 * 3600 * 1000;

function nfkc_(s) {
  return String(s == null ? '' : s).normalize('NFKC');
}

/** ブランド照合用の正規化（全角半角統一・大文字化・空白/中黒/ハイフン類を除去） */
function normKey_(s) {
  return nfkc_(s).toUpperCase().replace(/[\s・\-‐－―ー_.·]/g, '');
}

/** 駅名照合用の正規化（括弧内・空白・末尾の「駅」を除去） */
function normStationName_(s) {
  return nfkc_(s)
    .replace(/[（(][^）)]*[）)]/g, '')
    .replace(/\s/g, '')
    .replace(/駅$/, '');
}

function toNum_(v) {
  if (v === '' || v == null) return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  var m = nfkc_(v).match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}

function bool_(v) {
  if (typeof v === 'boolean') return v;
  var s = nfkc_(v).trim().toUpperCase();
  return s === 'TRUE' || s === '1' || s === 'YES' || s === 'はい';
}

function splitList_(s) {
  return nfkc_(s).split(/[,、]/).map(function (x) { return x.trim(); }).filter(function (x) { return x; });
}

/** 2点間の直線距離(m)。表示には使わず、検索範囲と異常値検出にのみ使う */
function haversineM_(a, b) {
  var R = 6371008.8;
  var toRad = Math.PI / 180;
  var dLat = (b.lat - a.lat) * toRad;
  var dLng = (b.lng - a.lng) * toRad;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(s));
}

/** "123s" / "123.5s" → 秒数 */
function parseDurationSec_(d) {
  if (d == null) return null;
  var m = String(d).match(/^(\d+(\.\d+)?)s$/);
  return m ? Number(m[1]) : null;
}

/** Places APIのviewport（外接矩形）から面積の概算(m2)を出す。実面積ではない */
function viewportAreaM2_(vp) {
  if (!vp || !vp.low || !vp.high) return null;
  var lat = (vp.low.latitude + vp.high.latitude) / 2;
  var h = haversineM_({ lat: vp.low.latitude, lng: vp.low.longitude }, { lat: vp.high.latitude, lng: vp.low.longitude });
  var w = haversineM_({ lat: lat, lng: vp.low.longitude }, { lat: lat, lng: vp.high.longitude });
  return Math.round(h * w);
}

/**
 * 次の「HH:mm（日本時間）」の出発時刻をRFC3339(UTC)で返す。
 * weekdayOnly=true の場合は土日を避ける。現在時刻から15分以内の場合は翌日以降にする。
 */
function nextDepartureIso_(hhmm, weekdayOnly, nowMs) {
  var now = nowMs == null ? Date.now() : nowMs;
  var p = String(hhmm || '03:00').split(':');
  var h = Number(p[0]) || 0;
  var mi = Number(p[1]) || 0;
  var j = new Date(now + JST_OFFSET_MS);
  var cand = Date.UTC(j.getUTCFullYear(), j.getUTCMonth(), j.getUTCDate(), h, mi) - JST_OFFSET_MS;
  var isWeekend = function (ms) {
    var dow = new Date(ms + JST_OFFSET_MS).getUTCDay();
    return dow === 0 || dow === 6;
  };
  while (cand < now + 15 * 60 * 1000 || (weekdayOnly && isWeekend(cand))) {
    cand += 86400000;
  }
  return new Date(cand).toISOString().replace(/\.\d{3}Z$/, 'Z');
}

function pad2_(n) { return (n < 10 ? '0' : '') + n; }

/** 日本時間 "yyyy/MM/dd HH:mm" */
function formatJst_(dateOrMs) {
  var ms = dateOrMs instanceof Date ? dateOrMs.getTime() : (dateOrMs == null ? Date.now() : dateOrMs);
  var j = new Date(ms + JST_OFFSET_MS);
  return j.getUTCFullYear() + '/' + pad2_(j.getUTCMonth() + 1) + '/' + pad2_(j.getUTCDate()) + ' ' +
    pad2_(j.getUTCHours()) + ':' + pad2_(j.getUTCMinutes());
}

function makeRunId_(nowMs) {
  var j = new Date((nowMs == null ? Date.now() : nowMs) + JST_OFFSET_MS);
  return 'R' + j.getUTCFullYear() + pad2_(j.getUTCMonth() + 1) + pad2_(j.getUTCDate()) +
    pad2_(j.getUTCHours()) + pad2_(j.getUTCMinutes()) + pad2_(j.getUTCSeconds());
}

/** "yyyy/MM/dd HH:mm" を日本時間として解釈しエポックmsへ */
function parseJst_(s) {
  if (s instanceof Date) return s.getTime();
  var m = String(s || '').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) - JST_OFFSET_MS;
}

function addFlag_(flags, msg) {
  if (msg && flags.indexOf(msg) < 0) flags.push(msg);
  return flags;
}

/* ---- src/02_DistanceRule.js ---- */
/**
 * 02_DistanceRule.js
 * 表示規約に関わる計算をこのファイルに集約する。
 *
 * - 徒歩所要時間：道路距離80mにつき1分。1分未満の端数は1分に切り上げ
 *   （不動産の表示に関する公正競争規約施行規則）。
 *   Routes APIの徒歩duration（Google独自の推定速度）は表示に使わない。
 * - 車の所要時間：Routes APIのduration（秒）を分に切り上げ。道路距離を併記できるようにする。
 */

/** 道路距離(m) → 徒歩分（80m/分、端数切り上げ、最小1分） */
function walkMinutes_(roadMeters, mPerMin) {
  if (roadMeters == null || isNaN(roadMeters)) return null;
  var unit = mPerMin || 80;
  return Math.max(1, Math.ceil(roadMeters / unit));
}

/** 秒 → 分（切り上げ、最小1分） */
function ceilMinutes_(sec) {
  if (sec == null || isNaN(sec)) return null;
  return Math.max(1, Math.ceil(sec / 60));
}

/** 表示用の距離（10m単位で切り上げ。短く見せない方向に丸める） */
function displayMeters_(m) {
  if (m == null) return null;
  return Math.ceil(m / 10) * 10;
}

/** 表示用のkm（0.1km単位で切り上げ） */
function displayKm_(m) {
  if (m == null) return null;
  return (Math.ceil(m / 100) / 10).toFixed(1);
}

/**
 * 道路距離の妥当性チェック。AIによる補正は行わず、怪しい値に「要確認」を付けるだけ。
 * @return {string[]} 要確認理由
 */
function distanceFlags_(roadM, straightM, detourMax) {
  var flags = [];
  if (roadM == null) {
    flags.push('徒歩経路が取得できない');
    return flags;
  }
  if (straightM != null && straightM - roadM > 20) {
    flags.push('道路距離が直線距離より短い（起点/施設の位置ずれの可能性）');
  }
  if (straightM != null && straightM > 50 && roadM / straightM > (detourMax || 2.0)) {
    flags.push('迂回率が高い（' + (roadM / straightM).toFixed(1) + '倍）');
  }
  return flags;
}

/* ---- src/07_Stations.js ---- */
/**
 * 07_Stations.js
 * 最寄り駅（3駅）の調査。
 *
 * ルール（マンスリー部門の運用）:
 *  1. マイソク記載の駅をベースにする。
 *  2. マイソクに3駅なければGoogle（Places API）の近い順で補う。
 *  3. Googleの道路距離から80m/分で算出した徒歩分の方が短ければ、そちらを採用する。
 *  4. 採用徒歩分が30分以上（ウェルモの入力上限）の場合は、徒歩分を空欄にしてバス/車の所要時間を出す。
 *  5. 複数路線のうち「利用者の多い路線」の選択はGoogle APIから取得できないため、担当者が「路線」列に入力する。
 */

var STATION_TYPES = ['train_station', 'subway_station', 'light_rail_station'];

function mysokuStations_(prop) {
  var list = [];
  for (var i = 1; i <= 3; i++) {
    var name = nfkc_(prop['マイソク駅' + i + '_駅名']).trim();
    if (!name) continue;
    list.push({
      name: name,
      line: nfkc_(prop['マイソク駅' + i + '_路線']).trim(),
      minutes: toNum_(prop['マイソク駅' + i + '_徒歩分'])
    });
  }
  return list;
}

/**
 * 採用徒歩分の決定（純粋関数）。マイソクとGoogle算出値のうち短い方。
 * @return {{minutes:number|null, from:string}}
 */
function adoptStationMinutes_(mysokuMin, googleMin) {
  if (mysokuMin == null && googleMin == null) return { minutes: null, from: '' };
  if (mysokuMin == null) return { minutes: googleMin, from: 'Google' };
  if (googleMin == null) return { minutes: mysokuMin, from: 'マイソク' };
  if (googleMin < mysokuMin) return { minutes: googleMin, from: 'Google（マイソクより短い）' };
  return { minutes: mysokuMin, from: 'マイソク' };
}

/**
 * マイソク駅とGoogle候補から枠を組む（純粋関数）。
 * @param {Array} mysoku mysokuStations_の結果
 * @param {Array} googleList {key, place, roadM, minutes} 道路距離順
 * @param {number} count 登録駅数
 */
function buildStationSlots_(mysoku, googleList, count) {
  var slots = [];
  var used = {};
  mysoku.forEach(function (m) {
    var key = normStationName_(m.name);
    var g = null;
    for (var i = 0; i < googleList.length; i++) {
      if (googleList[i].key === key) { g = googleList[i]; break; }
    }
    used[key] = true;
    slots.push({ source: 'マイソク', name: m.name, line: m.line, mysokuMin: m.minutes, g: g, key: key });
  });
  googleList.forEach(function (g) {
    if (slots.length >= count || used[g.key] || g.roadM == null) return;
    used[g.key] = true;
    slots.push({ source: 'Google', name: g.place.name, line: '', mysokuMin: null, g: g, key: g.key });
  });
  return slots.slice(0, Math.max(count, mysoku.length));
}

function surveyStations_(ctx, prop, origin) {
  var count = toNum_(ctx.settings.station_count) || 3;
  var radii = splitList_(ctx.settings.station_search_radii_m).map(Number).filter(function (n) { return n > 0; });
  if (!radii.length) radii = [2000, 5000, 10000];
  var byKey = {};
  for (var ri = 0; ri < radii.length; ri++) {
    placesNearby_(ctx, origin, STATION_TYPES, radii[ri]).forEach(function (p) {
      if (p.lat == null) return;
      if (p.businessStatus && p.businessStatus !== 'OPERATIONAL') return;
      var key = normStationName_(p.name);
      var straight = haversineM_(origin, p);
      if (!byKey[key] || straight < byKey[key].straightM) {
        byKey[key] = { key: key, place: p, straightM: Math.round(straight), roadM: null, minutes: null };
      }
    });
    if (Object.keys(byKey).length >= count + 2) break;
  }
  var googleList = Object.keys(byKey).map(function (k) { return byKey[k]; })
    .sort(function (a, b) { return a.straightM - b.straightM; })
    .slice(0, count + 5);

  // マイソク記載駅がGoogle候補にない場合は駅名で個別に検索
  var mysoku = mysokuStations_(prop);
  mysoku.forEach(function (m) {
    var key = normStationName_(m.name);
    if (googleList.some(function (g) { return g.key === key; })) return;
    var res = placesText_(ctx, key + '駅', origin, 20000, null);
    var hit = null;
    for (var i = 0; i < res.length; i++) {
      if (normStationName_(res[i].name) === key && res[i].lat != null) { hit = res[i]; break; }
    }
    if (hit) googleList.push({ key: key, place: hit, straightM: Math.round(haversineM_(origin, hit)), roadM: null, minutes: null });
  });

  var routes = walkMatrix_(ctx, origin, googleList.map(function (g) { return g.place; }));
  googleList.forEach(function (g, i) {
    if (routes[i]) {
      g.roadM = routes[i].distanceMeters;
      g.minutes = walkMinutes_(g.roadM, ctx.mPerMin);
    }
  });
  googleList.sort(function (a, b) {
    return (a.roadM == null ? Infinity : a.roadM) - (b.roadM == null ? Infinity : b.roadM);
  });

  var slots = buildStationSlots_(mysoku, googleList, count);
  var limit = toNum_(ctx.settings.welmo_walk_limit_min) || 30;
  var now = formatJst_();
  return slots.map(function (s, idx) {
    var flags = [];
    var g = s.g;
    var googleMin = g ? g.minutes : null;
    var adopted = adoptStationMinutes_(s.mysokuMin, googleMin);
    if (!g) addFlag_(flags, 'Googleで駅を特定できない（マイソク値のみ）');
    if (g) distanceFlags_(g.roadM, g.straightM, toNum_(ctx.settings.detour_ratio_max)).forEach(function (f) { addFlag_(flags, f); });
    if (adopted.from.indexOf('Google') === 0) addFlag_(flags, '駅の座標は代表点。駅出入口までの距離か地図で確認');
    if (!s.line) addFlag_(flags, '路線を入力（複数路線の場合は利用者の多い路線）');
    if (s.source === 'マイソク' && s.mysokuMin == null) addFlag_(flags, 'マイソク徒歩分が空欄');

    var row = {
      '物件ID': ctx.propertyId, '実行ID': ctx.runId, '枠': idx + 1, '出典': s.source,
      '駅名': s.name, '路線': s.line, 'マイソク徒歩分': s.mysokuMin,
      '道路距離m': g ? g.roadM : null, 'Google徒歩分': googleMin,
      '採用徒歩分': adopted.minutes, '採用元': adopted.from,
      '代替手段': '', '代替所要分': '', '代替距離m': '', '代替有料道路': '', '代替詳細': '',
      '要確認理由': '', '確認済': false, '備考': '',
      'place_id': g ? g.place.placeId : '', '緯度': g ? g.place.lat : '', '経度': g ? g.place.lng : '',
      '取得日時': now
    };

    if (adopted.minutes != null && adopted.minutes >= limit) {
      var alt = null;
      if (g) {
        try {
          alt = alternativeTransport_(ctx, origin, g.place);
        } catch (e) {
          addFlag_(flags, '代替手段の取得エラー: ' + e.message);
        }
      } else {
        addFlag_(flags, '徒歩' + limit + '分以上だが駅の座標がなくバス/車の所要時間を取得できない');
      }
      if (alt) {
        row['代替手段'] = alt.mode;
        row['代替所要分'] = alt.minutes;
        row['代替距離m'] = alt.distanceMeters;
        row['代替有料道路'] = alt.toll ? 'あり' : '';
        row['代替詳細'] = alt.detail;
        if (alt.note) addFlag_(flags, alt.note);
      }
    }
    row['要確認理由'] = flags.join(' / ');
    return row;
  });
}

/** 徒歩30分以上の駅への代替手段（バス優先→なければ車） */
function alternativeTransport_(ctx, origin, dest) {
  var mode = nfkc_(ctx.settings.alt_transport_mode).trim();
  if (mode !== '車のみ') {
    var bus = busRoute_(ctx, origin, dest);
    if (bus) {
      return { mode: 'バス', minutes: bus.minutes, distanceMeters: bus.distanceMeters, toll: false, detail: bus.detail,
        note: 'バス所要時間は検索時刻の時刻表による。停留所名・乗車時間を確認' };
    }
  }
  var car = driveWithTollCheck_(ctx, origin, dest);
  if (!car) return null;
  return { mode: '車', minutes: car.minutes, distanceMeters: car.distanceMeters, toll: car.toll, detail: car.detail,
    note: mode !== '車のみ' ? 'Googleでバス経路が取得できないため車で算出' : '' };
}

/* ---- src/09_Output.js ---- */
/**
 * 09_Output.js
 * 表示文の生成。固定テンプレートのみ（AIによる文章生成は行わない）。
 * 担当者が結果シートで編集した値（路線・運行会社・掲載可否）を反映するため、出力時に毎回組み立て直す。
 */

function stationBaseName_(name) {
  return nfkc_(name).trim().replace(/[（(][^）)]*[）)]/g, '').trim().replace(/駅$/, '');
}

/** 例: 名鉄瀬戸線「大曽根」駅 */
function formatStationLabel_(line, name) {
  return (line ? line : '（路線未入力）') + '「' + stationBaseName_(name) + '」駅';
}

/** 車の所要時間の付記。例: （約18.2km・有料道路あり） */
function driveSuffix_(distanceM, toll, showDistance) {
  var parts = [];
  if (showDistance && distanceM) parts.push('約' + displayKm_(distanceM) + 'km');
  if (toll) parts.push('有料道路あり');
  return parts.length ? '（' + parts.join('・') + '）' : '';
}

/**
 * 駅1行分の表示（純粋関数）
 * @return {{label:string, walk:string, other:string}}
 */
function formatStation_(row, limitMin, showDistance) {
  var label = formatStationLabel_(row['路線'], row['駅名']);
  var min = toNum_(row['採用徒歩分']);
  if (min == null) return { label: label, walk: '', other: '' };
  if (min < limitMin) return { label: label, walk: String(min), other: '' };
  var altMin = toNum_(row['代替所要分']);
  if (altMin == null) return { label: label, walk: '', other: '（徒歩' + limitMin + '分以上・代替手段未取得）' };
  if (row['代替手段'] === 'バス') return { label: label, walk: '', other: 'バスで' + altMin + '分' };
  return {
    label: label, walk: '',
    other: '車で' + altMin + '分' + driveSuffix_(toNum_(row['代替距離m']), row['代替有料道路'] === 'あり', showDistance)
  };
}

/** 例: ○○バス「△△」停から徒歩約n分 */
function formatBusStop_(row) {
  if (!row || !row['名称']) return '';
  var op = nfkc_(row['運行会社']).trim() || '○○バス';
  return op + '「' + row['名称'] + '」停から徒歩約' + row['徒歩分'] + '分';
}

/** 例: 県営名古屋空港から車で約n分（有料道路あり） */
function formatAirport_(row, showDistance) {
  if (!row || row['車所要分'] === '' || row['車所要分'] == null) return '';
  return row['名称'] + 'から車で約' + row['車所要分'] + '分' +
    driveSuffix_(toNum_(row['車距離m']), row['有料道路'] === 'あり', showDistance);
}

/**
 * 例: セブンイレブン 豊田市小川町店まで徒歩約2分
 *     スーパーマーケットバロー 東新町店まで車で約6分（徒歩分が閾値を超え、車の所要時間がある場合）
 */
function formatFacility_(row, showDistance) {
  var car = toNum_(row['車所要分']);
  if (car != null) {
    return row['名称'] + 'まで車で約' + car + '分' + driveSuffix_(toNum_(row['車距離m']), false, showDistance);
  }
  return row['名称'] + 'まで徒歩約' + row['徒歩分'] + '分';
}

/** 周辺施設の複数行テキスト（カテゴリの出力順→道路距離順。純粋関数） */
function formatFacilities_(rows, categories, showDistance) {
  var lines = [];
  var cats = categories.slice().sort(function (a, b) { return a.order - b.order; });
  cats.forEach(function (cat) {
    rows.filter(function (r) { return r['カテゴリID'] === cat.id && bool_(r['掲載']) && r['名称']; })
      .sort(function (a, b) { return toNum_(a['道路距離m']) - toNum_(b['道路距離m']); })
      .forEach(function (r) { lines.push(formatFacility_(r, showDistance)); });
  });
  return lines.join('\n');
}

/** 未確認の要確認件数 */
function countUnconfirmed_(facRows, stRows, acRows) {
  var n = 0;
  facRows.forEach(function (r) {
    if ((r['採否'] === '採用' || r['採否'] === '該当なし' || r['採否'] === 'エラー') && r['要確認理由'] && !bool_(r['確認済'])) n++;
  });
  stRows.forEach(function (r) { if (r['要確認理由'] && !bool_(r['確認済'])) n++; });
  acRows.forEach(function (r) { if (bool_(r['採用']) && r['要確認理由'] && !bool_(r['確認済'])) n++; });
  return n;
}

/** 物件1件分の出力行（純粋関数） */
function buildOutputRow_(prop, facRows, stRows, acRows, categories, settings) {
  var limit = toNum_(settings.welmo_walk_limit_min) || 30;
  var showDist = bool_(settings.show_drive_distance);
  var out = { '物件ID': prop['物件ID'], '物件名': prop['物件名'] };
  var st = stRows.slice().sort(function (a, b) { return toNum_(a['枠']) - toNum_(b['枠']); });
  for (var i = 0; i < 3; i++) {
    var f = st[i] ? formatStation_(st[i], limit, showDist) : { label: '', walk: '', other: '' };
    out['駅' + (i + 1)] = f.label;
    out['駅' + (i + 1) + '_徒歩分'] = f.walk;
    out['駅' + (i + 1) + '_その他'] = f.other;
  }
  var bus = acRows.filter(function (r) { return r['種別'] === 'バス停' && bool_(r['採用']); })[0];
  var air = acRows.filter(function (r) { return r['種別'] === '空港' && bool_(r['採用']); })[0];
  out['その他アクセス'] = formatBusStop_(bus);
  out['空港からのアクセス'] = formatAirport_(air, showDist);
  out['周辺施設'] = formatFacilities_(facRows, categories, showDist);
  out['出典表記'] = out['周辺施設'] ? String(settings.attribution || '') : '';
  var t = buildTitleFromResults_(prop, st, facRows, settings);
  out['タイトル'] = t.title;
  out['タイトル文字数'] = t.length;
  out['タイトル注記'] = t.notes.join(' / ');
  out['未確認の要確認件数'] = countUnconfirmed_(facRows, stRows, acRows);
  out['ウェルモJSON'] = JSON.stringify(buildWellmoData_(prop, out, st));
  out['生成日時'] = formatJst_();
  return out;
}

/* ---- src/12_Title.js ---- */
/**
 * 12_Title.js
 * 物件タイトルの自動生成。
 *
 * 書式:
 *  【エリア/最寄り駅&徒歩分数/駐車場/無料Wi-Fi/角部屋/バストイレ別(・独立洗面台)/洋室〇帖 or 全居室6帖以上/
 *    リフォーム済/オートロック/エレベーター/宅配BOX/自転車駐輪可能/その他アピール】建物名
 *  - 建物登録用のため号室は付けない（設定 title_room_format で変更可）
 *  - エリア・最寄り駅・建物名は必須。それ以降は該当するもののみ。
 *  - 最寄り駅は徒歩10分以内なら「今池駅徒歩4分」、超える場合は「今池駅」のみ。
 *  - USEN AIRは無料Wi-Fiとして扱わない。
 *  - 自転車駐輪可能は、駐車場ありの物件では書かない。
 *  - 60文字を超える場合は、後ろの要素から順に削る。
 *
 * エリアと最寄り駅は調査結果（Geocoding / Places / Routes）から、設備は物件シートの入力値から作る。
 * 「著名な施設」かどうかの判断はAPIではできないため、その他アピールは担当者入力、
 * または担当者が掲載チェックした大型商業施設のみを使う。
 */

function charLen_(s) {
  return Array.from(String(s)).length;
}

/**
 * Geocodingのaddress_componentsからエリア表記を作る（純粋関数）。
 * @param {Array} comps address_components（language=ja）
 * @param {string} formatted formatted_address（componentsで判定できない場合の予備）
 * @param {Object} opt {wardCities:string[], otherStyle:'県+市'|'市のみ'}
 */
function areaFromGeocode_(comps, formatted, opt) {
  var has = function (c, t) { return (c.types || []).indexOf(t) >= 0; };
  var find = function (pred) {
    for (var i = 0; i < (comps || []).length; i++) if (pred(comps[i])) return comps[i].long_name;
    return '';
  };
  var pref = find(function (c) { return has(c, 'administrative_area_level_1'); });
  var city = find(function (c) { return has(c, 'locality'); });
  var ward = find(function (c) {
    return has(c, 'ward') || ((has(c, 'sublocality_level_1') || has(c, 'locality')) && /区$/.test(c.long_name) && c.long_name !== city);
  });
  if (!pref || !city) {
    // 予備: 住所文字列から抽出（例: 日本、〒464-0850 愛知県名古屋市千種区今池1丁目）
    var addr = nfkc_(formatted).replace(/^日本、?\s*/, '').replace(/^〒?\d{3}-?\d{4}\s*/, '');
    var m = addr.match(/^(東京都|北海道|(?:京都|大阪)府|.{2,3}県)(.+?郡.+?[町村]|.+?市)(.+?区)?/);
    if (m) {
      pref = pref || m[1];
      city = city || m[2];
      ward = ward || m[3] || '';
    }
  }
  if (!city) return '';
  var wardCities = (opt && opt.wardCities) || ['名古屋市'];
  if (ward && wardCities.indexOf(city) >= 0) return ward;
  if (opt && opt.otherStyle === '市のみ') return city;
  return pref + city;
}

/** 採用徒歩分の最も短い駅（純粋関数） */
function nearestStation_(stRows) {
  var best = null;
  (stRows || []).forEach(function (r) {
    var m = toNum_(r['採用徒歩分']);
    if (m == null || !r['駅名']) return;
    if (!best || m < best.minutes) best = { name: stationBaseName_(r['駅名']), minutes: m };
  });
  return best;
}

/**
 * タイトルを組み立てる（純粋関数）。
 * @param {Object} p 物件シートの1行
 * @param {{name:string, minutes:number}|null} station 最寄り駅
 * @param {string} autoAppeal 自動のその他アピール（空可）
 * @param {Object} settings
 * @return {{title:string, length:number, notes:string[]}}
 */
function buildTitle_(p, station, autoAppeal, settings) {
  var notes = [];
  var maxLen = toNum_(settings.title_max_length) || 60;
  var walkMax = toNum_(settings.title_station_walk_max_min) || 10;

  var area = nfkc_(p['エリア']).trim();
  if (!area) notes.push('エリアが未設定');
  var st = '';
  if (station) {
    st = station.name + '駅' + (station.minutes <= walkMax ? '徒歩' + station.minutes + '分' : '');
  } else {
    notes.push('最寄り駅が未取得');
  }
  var building = String(p['建物名'] || '').trim();
  var room = String(p['号室'] || '').trim();
  if (!building) notes.push('建物名が未入力');
  var tailFormat = String(settings.title_room_format || '{建物名}');
  if (!room && tailFormat.indexOf('{号室}') >= 0) notes.push('号室が未入力');

  var opts = [];
  var parking = bool_(p['駐車場']);
  if (parking) opts.push('駐車場');
  if (bool_(p['無料Wi-Fi'])) {
    if (/USEN/i.test(nfkc_(p['Wi-Fiサービス名']))) notes.push('USEN AIRは無料Wi-Fiとして扱わないため除外');
    else opts.push('無料Wi-Fi');
  }
  if (bool_(p['角部屋'])) opts.push('角部屋');
  if (bool_(p['バストイレ別'])) opts.push('バストイレ別' + (bool_(p['独立洗面台']) ? '・独立洗面台' : ''));
  else if (bool_(p['独立洗面台'])) opts.push('独立洗面台');
  var jo = toNum_(p['最大洋室帖数']);
  if (jo != null && jo >= 7) opts.push('洋室' + jo + '帖');
  else if (bool_(p['全居室6帖以上'])) opts.push('全居室6帖以上');
  if (bool_(p['リフォーム済'])) opts.push('リフォーム済');
  if (bool_(p['オートロック'])) opts.push('オートロック');
  if (bool_(p['エレベーター'])) opts.push('エレベーター');
  if (bool_(p['宅配BOX'])) opts.push('宅配BOX');
  if (bool_(p['自転車駐輪可能']) && !parking) opts.push('自転車駐輪可能');
  var appeal = String(p['その他アピール'] || '').trim() || autoAppeal || '';
  if (appeal) opts.push(appeal);

  var tail = tailFormat
    .replace('{建物名}', building).replace('{号室}', room).trim();
  var compose = function (o) {
    return '【' + [area, st].filter(function (x) { return x; }).concat(o).join('/') + '】' + tail;
  };
  var title = compose(opts);
  var cut = [];
  while (charLen_(title) > maxLen && opts.length) {
    cut.unshift(opts.pop());
    title = compose(opts);
  }
  if (cut.length) notes.push(maxLen + '文字超過のため削除: ' + cut.join('、'));
  if (charLen_(title) > maxLen) notes.push('必須項目だけで' + maxLen + '文字を超過。手動で調整');
  return { title: title, length: charLen_(title), notes: notes };
}

/** 調査結果シートの行からタイトルを作る */
function buildTitleFromResults_(prop, stRows, facRows, settings) {
  var auto = '';
  if (bool_(settings.title_auto_appeal) && !String(prop['その他アピール'] || '').trim()) {
    var malls = (facRows || []).filter(function (r) {
      return r['カテゴリID'] === 'mall' && r['採否'] === '採用' && bool_(r['掲載']) && r['名称'] && r['車所要分'] === '';
    }).sort(function (a, b) { return toNum_(a['道路距離m']) - toNum_(b['道路距離m']); });
    if (malls[0]) auto = malls[0]['名称'] + '徒歩' + malls[0]['徒歩分'] + '分';
  }
  return buildTitle_(prop, nearestStation_(stRows), auto, settings);
}

/* ---- src/13_Mysoku.js ---- */
/**
 * 13_Mysoku.js
 * マイソクPDFの取り込み。
 *
 * 1. PDFをGoogleドライブの変換機能（PDF→Googleドキュメント、日本語OCR）でテキスト化する。
 * 2. 「物件名」「号室名」「所在地」「交通」「駐車場」「設備」などの見出しを固定ルール（正規表現）で読み取る。
 *    AIによる推測・要約は行わない。読み取れなかった項目は空欄のまま残し、メモに記録する。
 * 3. 物件シートの空欄だけを埋める（担当者の手入力は上書きしない）。チェックボックスはONにするだけで、OFFにはしない。
 */

// 見出し（RealNetPro形式のマイソクを基準。文字間の空白「設 備」も許容）
var MYSOKU_LABELS = ['物件種目', '物件名', '号室名', '号室', '所在地', '交通', '建築構造', '間取タイプ', '間取',
  '専有面積', '築年', '現況', '入居時期', '賃料', '共益費', '管理費', '敷金', '礼金', '保証金', '更新料', '契約期間',
  '町内会費', '駐車場', '備考', '設備', '条件', '取引態様', '手数料', '特記事項'];

function labelRegex_(label) {
  return label.split('').join('\\s*');
}

/** 行が見出しで始まっていれば {label, rest} を返す */
function matchLabel_(line) {
  // 長い見出しを優先（「号室名」を「号室」より先に）
  var labels = MYSOKU_LABELS.slice().sort(function (a, b) { return b.length - a.length; });
  for (var i = 0; i < labels.length; i++) {
    var m = line.match(new RegExp('^' + labelRegex_(labels[i]) + '(?![^\\s:：・])\\s*[:：]?\\s*(.*)$'));
    if (m) return { label: labels[i], rest: m[1].trim() };
    // 「共益費・管理費」のような複合見出し
    var m2 = line.match(new RegExp('^' + labelRegex_(labels[i]) + '[・/][^\\s]*\\s+(.*)$'));
    if (m2) return { label: labels[i], rest: m2[1].trim() };
  }
  return null;
}

/** テキストを見出しごとのブロックに分ける（同じ見出しは最初の1つ） */
function splitMysokuSections_(text) {
  var lines = nfkc_(text).split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l; });
  var sections = {};
  var current = null;
  lines.forEach(function (line) {
    var lm = matchLabel_(line);
    if (lm) {
      current = sections[lm.label] ? null : lm.label; // 2回目以降の同名見出しは無視
      if (current) sections[current] = lm.rest ? [lm.rest] : [];
      return;
    }
    if (current) sections[current].push(line);
  });
  return sections;
}

function firstValue_(sections, label) {
  var s = sections[label];
  return s && s.length ? s[0] : '';
}

/**
 * マイソクのテキストを解析する（純粋関数）。
 * @return {{fields:Object, stations:Array, equipment:Object, notes:string[]}}
 */
function parseMysokuText_(text) {
  var sec = splitMysokuSections_(text);
  var notes = [];
  var fields = {};

  var name = firstValue_(sec, '物件名');
  if (name) fields['物件名'] = name;

  var room = firstValue_(sec, '号室名') || firstValue_(sec, '号室');
  room = room.replace(/\(.*?\)/g, '').replace(/号室$/, '').trim();
  if (room) fields['号室'] = room;

  var kind = firstValue_(sec, '物件種目');
  var kindM = kind.match(/マンション|アパート|一戸建|戸建/);
  if (kindM) fields['物件種別'] = kindM[0] === 'マンション' || kindM[0] === 'アパート' ? kindM[0] : '一戸建て';
  else if (kind) fields['物件種別'] = 'その他';

  var postal = (sec['所在地'] || []).join(' ').match(/〒?\s*(\d{3})-?(\d{4})/);
  if (postal) fields['郵便番号'] = postal[1] + '-' + postal[2];

  var struct = (sec['建築構造'] || []).join(' ');
  if (struct) {
    var code = /鉄骨鉄筋|SRC/.test(struct) ? 'SRC' : /鉄筋コンクリート|RC/.test(struct) ? 'RC'
      : /軽量鉄骨/.test(struct) ? '軽量鉄骨' : /鉄骨|S造/.test(struct) ? 'S' : /木造/.test(struct) ? '木造' : 'その他';
    fields['建物構造'] = code;
    var above = struct.match(/地上\s*(\d+)\s*階/) || struct.match(/(\d+)\s*階建/);
    if (above) fields['地上階数'] = Number(above[1]);
    var below = struct.match(/地下\s*(\d+)\s*階/);
    fields['地下階数'] = below ? Number(below[1]) : (above ? 0 : '');
    var units = struct.match(/総戸数\s*(\d+)\s*戸/);
    if (units) fields['総戸数'] = Number(units[1]);
  }
  var built = firstValue_(sec, '築年').match(/(\d{4})\s*年\s*(\d{1,2})?/);
  if (built) {
    fields['築年'] = Number(built[1]);
    if (built[2]) fields['築月'] = Number(built[2]);
  }

  var addrLines = (sec['所在地'] || []).filter(function (l) { return !/^〒?\s*\d{3}-?\d{4}$/.test(l); });
  var addr = '';
  for (var i = 0; i < addrLines.length; i++) {
    if (/(東京都|北海道|(?:京都|大阪)府|.{2,3}県)/.test(addrLines[i])) { addr = addrLines[i]; break; }
  }
  addr = addr.replace(/〒?\s*\d{3}-?\d{4}/, '').trim();
  if (addr) fields['住所'] = addr;

  // 交通: 「路線「駅」徒歩n分」形式。バス停（「停」「バス」を含む）は除外
  var stations = [];
  (sec['交通'] || []).forEach(function (line) {
    var re = /([^\s「」\/]*?)\s*「([^」]+)」\s*(駅|停|停留所)?\s*(?:から)?\s*(?:徒歩|歩)\s*(\d+)\s*分/g;
    var m;
    while ((m = re.exec(line)) !== null) {
      if (/停/.test(m[3] || '') || /バス/.test(m[1])) continue;
      stations.push({ line: m[1].trim(), name: m[2].trim(), minutes: Number(m[4]) });
    }
  });
  if (!stations.length) notes.push('交通（駅）を読み取れない');

  // 駐車場
  var parkingText = firstValue_(sec, '駐車場');
  var parking = null;
  if (/^(有|あり|空(き)?(有|あり)|敷地内)/.test(parkingText)) parking = true;
  else if (/^(なし|無|無し|-)/.test(parkingText)) parking = false;
  else if (parkingText) notes.push('駐車場の記載を確認: ' + parkingText);

  // 設備（改行で単語が分かれることがあるので連結して判定）。角部屋などは備考にも書かれるため備考も対象
  var equipText = (sec['設備'] || []).concat(sec['備考'] || []).join('');
  var eq = {
    '駐車場': parking === true,
    'バストイレ別': /バス\s*[・･]?\s*トイレ\s*別/.test(equipText),
    '独立洗面台': /洗面台\s*\(\s*独立\s*\)|独立洗面/.test(equipText),
    '無料Wi-Fi': /インターネット(使用料)?無料|無料インターネット|Wi-?Fi\s*無料|無料\s*Wi-?Fi/i.test(equipText),
    '角部屋': /角部屋/.test(equipText),
    'リフォーム済': /リフォーム/.test(equipText),
    'オートロック': /オートロック/.test(equipText),
    'エレベーター': /エレベータ/.test(equipText),
    '宅配BOX': /宅配\s*(ボックス|BOX|ロッカー)/i.test(equipText),
    '自転車駐輪可能': /駐輪/.test(equipText),
    '防犯カメラ': /防犯カメラ/.test(equipText),
    'コンシェルジュ': /コンシェルジュ/.test(equipText),
    '自動販売機': /自動販売機|自販機/.test(equipText),
    'TVドアホン': /(TV|テレビ)\s*(モニター)?\s*(付き?)?\s*(インターホン|ドアホン)|モニター\s*付き?\s*(インターホン|ドアホン)/i.test(equipText),
    'ゴミ捨て場': /(ゴミ|ごみ)\s*(置場|置き場|捨て場|ステーション)|24時間\s*(ゴミ|ごみ)出し/.test(equipText)
  };
  if (/USEN/i.test(equipText)) fields['Wi-Fiサービス名'] = 'USEN AIR';
  if (!sec['設備']) notes.push('設備欄を読み取れない');

  // 洋室の帖数（間取図が画像の場合は読み取れないことがある）
  var maxJo = null;
  var reJo = /洋(?:室)?\s*(\d+(?:\.\d+)?)\s*(?:帖|畳|J)/g;
  var mj;
  var all = nfkc_(text);
  while ((mj = reJo.exec(all)) !== null) {
    var v = Number(mj[1]);
    if (maxJo == null || v > maxJo) maxJo = v;
  }
  if (maxJo != null) fields['最大洋室帖数'] = maxJo;
  else notes.push('洋室の帖数を読み取れない（間取図を確認）');

  return { fields: fields, stations: stations.slice(0, 3), equipment: eq, notes: notes };
}

/**
 * 物件シートに反映する差分を作る（純粋関数）。空欄の項目だけを埋める。
 * @return {{patch:Object, filled:string[], skipped:string[]}}
 */
function mysokuPatch_(prop, parsed) {
  var patch = {};
  var filled = [];
  var skipped = [];
  var isBlank = function (v) { return v === '' || v == null; };
  var setIfBlank = function (col, val) {
    if (val === '' || val == null) return;
    if (isBlank(prop[col])) { patch[col] = val; filled.push(col); }
    else if (String(prop[col]) !== String(val)) skipped.push(col + '（入力済: ' + prop[col] + ' / マイソク: ' + val + '）');
  };
  setIfBlank('物件名', parsed.fields['物件名']);
  setIfBlank('建物名', parsed.fields['物件名']);
  setIfBlank('号室', parsed.fields['号室']);
  setIfBlank('住所', parsed.fields['住所']);
  setIfBlank('最大洋室帖数', parsed.fields['最大洋室帖数']);
  setIfBlank('Wi-Fiサービス名', parsed.fields['Wi-Fiサービス名']);
  ['物件種別', '郵便番号', '建物構造', '地上階数', '地下階数', '総戸数', '築年', '築月'].forEach(function (k) {
    setIfBlank(k, parsed.fields[k]);
  });

  var stationsBlank = [1, 2, 3].every(function (i) { return isBlank(prop['マイソク駅' + i + '_駅名']); });
  if (stationsBlank && parsed.stations.length) {
    parsed.stations.forEach(function (s, i) {
      patch['マイソク駅' + (i + 1) + '_駅名'] = s.name;
      patch['マイソク駅' + (i + 1) + '_路線'] = s.line;
      patch['マイソク駅' + (i + 1) + '_徒歩分'] = s.minutes;
    });
    filled.push('マイソク駅' + parsed.stations.length + '件');
  } else if (parsed.stations.length) {
    skipped.push('マイソク駅（入力済）');
  }

  Object.keys(parsed.equipment).forEach(function (col) {
    if (parsed.equipment[col] && !bool_(prop[col])) { patch[col] = true; filled.push(col); }
  });
  return { patch: patch, filled: filled, skipped: skipped };
}

/* ---------------- GAS（Drive） ---------------- */

/** URL・ファイルIDの文字列からIDを取り出す */
function driveFileId_(s) {
  var str = String(s || '').trim();
  var m = str.match(/\/d\/([-\w]{20,})/) || str.match(/[?&]id=([-\w]{20,})/);
  if (m) return m[1];
  return /^[-\w]{20,}$/.test(str) ? str : '';
}

/**
 * PDFをGoogleドキュメントに変換してテキストを取り出し、一時ドキュメントは削除する。
 * 要: 拡張サービス「Drive API (v3)」
 */
function pdfToText_(fileId) {
  var file = DriveApp.getFileById(fileId);
  var tmp = Drive.Files.create(
    { name: '[一時]マイソク変換_' + file.getName(), mimeType: 'application/vnd.google-apps.document' },
    file.getBlob(),
    { ocrLanguage: 'ja', supportsAllDrives: true, fields: 'id' }
  );
  try {
    return DocumentApp.openById(tmp.id).getBody().getText();
  } finally {
    try {
      Drive.Files.remove(tmp.id, { supportsAllDrives: true });
    } catch (e) {
      DriveApp.getFileById(tmp.id).setTrashed(true);
    }
  }
}

/** 物件シートの1行にマイソクを取り込む */
function importMysokuForRow_(prop) {
  var fileId = driveFileId_(prop['マイソクPDF']);
  if (!fileId) throw new Error('「マイソクPDF」列にPDFのURLまたはファイルIDがありません');
  var text = pdfToText_(fileId);
  var parsed = parseMysokuText_(text);
  var r = mysokuPatch_(prop, parsed);
  var memo = [];
  if (r.filled.length) memo.push('反映: ' + r.filled.join('、'));
  if (r.skipped.length) memo.push('入力済のため未反映: ' + r.skipped.join('、'));
  if (parsed.notes.length) memo.push('要確認: ' + parsed.notes.join('、'));
  r.patch['マイソク取込日時'] = formatJst_();
  r.patch['マイソク取込メモ'] = memo.join(' / ') || '反映する項目なし';
  updateRow_(SHEETS.PROPERTIES, prop._row, r.patch);
  return r;
}

/** マイソクフォルダ内の未登録PDFを新しい物件行として追加し、取り込む */
function importMysokuFolder_(settings, startMs) {
  var folderId = driveFileId_(settings.mysoku_folder_id) || String(settings.mysoku_folder_id || '').trim();
  var m = String(settings.mysoku_folder_id || '').match(/folders\/([-\w]{20,})/);
  if (m) folderId = m[1];
  if (!folderId) throw new Error('設定「mysoku_folder_id」にマイソクPDFを置くフォルダのURLまたはIDを入力してください');
  var t = readTable_(SHEETS.PROPERTIES);
  var known = {};
  t.rows.forEach(function (r) { var id = driveFileId_(r['マイソクPDF']); if (id) known[id] = true; });
  var it = DriveApp.getFolderById(folderId).getFilesByType('application/pdf');
  var results = [];
  while (it.hasNext()) {
    if (Date.now() - startMs > MAX_EXEC_MS) { results.push('（時間切れのため中断。再実行してください）'); break; }
    var f = it.next();
    if (known[f.getId()]) continue;
    var prop = addPropertyRowForFile_(f);
    var rowNum = prop._row;
    try {
      importMysokuForRow_(prop);
      results.push(f.getName() + ': 取込済');
    } catch (e) {
      updateRow_(SHEETS.PROPERTIES, rowNum, { 'マイソク取込メモ': 'エラー: ' + e.message });
      results.push(f.getName() + ': エラー ' + e.message);
    }
  }
  return results;
}

/** 物件シートの次の空き行（未チェックのチェックボックスだけの行は空き行とみなす） */
function nextEmptyPropertyRow_() {
  var rows = readTable_(SHEETS.PROPERTIES).rows;
  var last = 1;
  rows.forEach(function (r) { if (r._row > last) last = r._row; });
  return last + 1;
}

/** PDFファイル1件分の物件行を追加（物件IDも採番） */
function addPropertyRowForFile_(file) {
  var sh = sheet_(SHEETS.PROPERTIES);
  var headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String);
  var rowNum = nextEmptyPropertyRow_();
  var id = 'P' + ('0000' + rowNum).slice(-5);
  var row = headers.map(function (h) {
    if (h === 'マイソクPDF') return file.getUrl();
    if (h === '物件ID') return id;
    return (CHECKBOX_COLUMNS[SHEETS.PROPERTIES] || []).indexOf(h) >= 0 ? false : '';
  });
  sh.getRange(rowNum, 1, 1, headers.length).setValues([row]);
  applyCheckboxes_(sh, headers, SHEETS.PROPERTIES, rowNum, 1);
  var prop = { _row: rowNum };
  headers.forEach(function (h, i) { prop[h] = row[i]; });
  return prop;
}

/* ---- src/14_Wellmo.js ---- */
/**
 * 14_Wellmo.js
 * ウェルモ「建物管理｜編集」画面への入力データ（JSON）を作る。

  /* ---------- API ---------- */
  var api = {

    api_reimportMysoku: function (id) { return { filled: [], skipped: [], data: api.api_getProperty(id) }; },

    api_locate: function (id) {

        assign(p, { '起点緯度': Math.round(g.lat * 1e6) / 1e6, '起点経度': Math.round(g.lng * 1e6) / 1e6, 'Geocode種別': g.type, 'Geocode住所': g.addr,
          'エリア': p['エリア'] || areaFromGeocode_([], g.addr, { wardCities: ['名古屋市'] }) });

    api_mapImage: function (lat, lng, zoom) {

    },
    api_confirmOrigin: function (id, lat, lng) {
      var p = findProp(id);

      assign(p, { '起点緯度': lat, '起点経度': lng, '起点確認済': true });
      if (moved && rowsOf(DB.fac, id).length) p['ステータス'] = '要再調査';

    },
    api_runSurvey: function (id) {
      var p = findProp(id);

      if (kind === 'access' && patch['採用'] === true) list.forEach(function (r) { if (r !== row && r['物件ID'] === id && r['種別'] === row['種別']) r['採用'] = false; });
      regen(id);
      return api.api_getProperty(id);
    }
  };

  var DELAY = { api_runSurvey: 2600, api_uploadMysoku: 1400, api_locate: 500, api_mapImage: 300 };

    call: function (fn) {

<script>
(function () {
  'use strict';

  /* ================= サーバー呼び出し（GAS / デモ） ================= */
  var API = window.DEMO_BACKEND || {
    call: function (fn) {
      var args = Array.prototype.slice.call(arguments, 1);

  };
  if (window.DEMO_BACKEND) document.getElementById('demo-band').hidden = false;

  var STRUCTS = [['RC', 'RC（鉄筋コンクリート）'], ['SRC', 'SRC（鉄骨鉄筋コンクリート）'], ['S', 'S（鉄骨）'], ['軽量鉄骨', '軽量鉄骨'], ['木造', '木造'], ['その他', 'その他']];
  var EQUIP_TITLE = [['駐車場', '駐車場'], ['無料Wi-Fi', '無料Wi-Fi'], ['角部屋', '角部屋'], ['バストイレ別', 'バストイレ別'], ['独立洗面台', '独立洗面台'],
    ['全居室6帖以上', '全居室6帖以上'], ['リフォーム済', 'リフォーム済'], ['オートロック', 'オートロック'], ['エレベーター', 'エレベーター'],
    ['宅配BOX', '宅配ボックス'], ['自転車駐輪可能', '駐輪場']];
  var EQUIP_WELLMO = [['防犯カメラ', '防犯カメラ'], ['コンシェルジュ', 'コンシェルジュ'], ['自動販売機', '自動販売機'], ['TVドアホン', 'TVドアホン'], ['ゴミ捨て場', 'ゴミ捨て場']];
  var MAP_W = 640, MAP_H = 400;

  /* ================= 状態 ================= */
  var S = {
    list: [], filter: 'all', query: '',

  /* ================= 小道具 ================= */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function b(v) { return v === true || v === 'TRUE' || v === 'true'; }
  function n(v) { if (v === '' || v == null) return null; var x = Number(String(v).normalize('NFKC').replace(/[^\d.\-]/g, '')); return isNaN(x) ? null : x; }

  function toast(msg) {

  }
  function errorText(e) { return (e && e.message) ? e.message : String(e); }

  /* ================= 作業面 ================= */

    w.innerHTML =
      '<div class="work-scroll"><div class="work-inner">' +
